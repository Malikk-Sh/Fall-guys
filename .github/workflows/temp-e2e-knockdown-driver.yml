name: Focused knockdown E2E driver

on:
  push:
    branches:
      - agent/game-feel-e2e-lab

permissions:
  contents: write

jobs:
  focused-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/game-feel-e2e-lab
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Patch driver to evade after knockdown
        env:
          OLD_STATUS: ICAgICAgICByZXR1cm4gewogICAgICAgICAgeDogcGxheWVyPy5wb3NpdGlvbj8ueCA/PyAwLAogICAgICAgICAgZmluaXNoZWQ6ICEhcGxheWVyPy5maW5pc2hlZCwKICAgICAgICAgIHJlc3VsdHM6ICFkb2N1bWVudC5xdWVyeVNlbGVjdG9yKCcjZmluaXNoJyk/LmNsYXNzTGlzdC5jb250YWlucygnaGlkZGVuJykKICAgICAgICB9Owo=
          NEW_STATUS: 
          OLD_SETUP: ICBhd2FpdCBob2xkKCdLZXlXJyk7CiAgdHJ5IHsKICAgIHdoaWxlIChEYXRlLm5vdygpIDwgZGVhZGxpbmUpIHsK
          NEW_SETUP: ICBsZXQgZXZhZGVEaXJlY3Rpb24gPSAxOwogIGxldCBldmFkZVVudGlsID0gMDsKICBsZXQgd2FzS25vY2tlZERvd24gPSBmYWxzZTsKCiAgYXdhaXQgaG9sZCgnS2V5VycpOwogIHRyeSB7CiAgICB3aGlsZSAoRGF0ZS5ub3coKSA8IGRlYWRsaW5lKSB7Cg==
          OLD_STEERING: 
          NEW_STEERING: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path

          path = Path('e2e/full-match.spec.js')
          text = path.read_text()
          for old_key, new_key in [('OLD_STATUS', 'NEW_STATUS'), ('OLD_SETUP', 'NEW_SETUP'), ('OLD_STEERING', 'NEW_STEERING')]:
              old = base64.b64decode(os.environ[old_key]).decode()
              new = base64.b64decode(os.environ[new_key]).decode()
              if text.count(old) != 1:
                  raise SystemExit(f'{old_key}: expected one match, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Format and verify patch
        run: |
          npx prettier --write e2e/full-match.spec.js
          npx prettier --check e2e/full-match.spec.js
          git diff --check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused full-match scenarios
        run: npx playwright test e2e/full-match.spec.js --project=chromium

      - name: Commit verified driver without helper workflow
        run: |
          rm .github/workflows/temp-e2e-knockdown-driver.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/full-match.spec.js .github/workflows/temp-e2e-knockdown-driver.yml
          git commit -m 'Teach full-match driver to evade after knockdown'
          git push origin HEAD:agent/game-feel-e2e-lab
