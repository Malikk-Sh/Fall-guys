name: Temporary format admin analytics

on:
  push:
    branches: [feat/admin-analytics-usability]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/admin-analytics-usability
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            client/admin/admin.js \
            client/admin/index.html \
            docs/ADMIN-PANEL.md \
            server/adminAnalytics.js \
            server/adminAnalytics.test.mjs

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/admin/admin.js client/admin/index.html docs/ADMIN-PANEL.md server/adminAnalytics.js server/adminAnalytics.test.mjs
          git commit -m 'Format admin analytics changes'
          git push origin HEAD:feat/admin-analytics-usability
