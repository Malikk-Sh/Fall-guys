name: Temporary social profile projection fix

on:
  push:
    branches:
      - agent/social-safety-replay
    paths:
      - .github/workflows/tmp-fix-social-profile.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/social-safety-replay
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch Accounts recent-partner projection
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path('server/accounts.js')
          source = path.read_text()

          profile_pattern = re.compile(
              r"(lastChapterId:\s*recent\.last_chapter_id,\s*\n\s*lastPlayedAt:\s*recent\.last_played_at)(\s*\n)"
          )
          source, count = profile_pattern.subn(
              lambda m: m.group(1) + ",\n            avoided: Boolean(recent.avoided)" + m.group(2),
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('profile anchor mismatch')

          query_pattern = re.compile(
              r"(SELECT rp\.partner_account_id, a\.display_name, rp\.matches_together,\s*\n\s*rp\.last_chapter_id, rp\.last_played_at)(\s*\n\s*FROM recent_partners rp)"
          )
          def add_avoid_projection(match):
              return match.group(1) + """,
             EXISTS (
               SELECT 1 FROM matchmaking_avoids ma
               WHERE (ma.account_a = rp.account_id AND ma.account_b = rp.partner_account_id)
                  OR (ma.account_a = rp.partner_account_id AND ma.account_b = rp.account_id)
             ) AS avoided""" + match.group(2)

          source, count = query_pattern.subn(add_avoid_projection, source, count=1)
          if count != 1:
              raise SystemExit('query anchor mismatch')

          path.write_text(source)
          PY
      - run: npx prettier --write server/accounts.js
      - run: npx eslint server/accounts.js
      - name: Verify profile and social safety projection
        run: node --test server/socialProfile.test.mjs server/socialSafety.test.mjs
      - name: Commit permanent fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/accounts.js
          git diff --cached --quiet && exit 0
          git commit -m 'Expose matchmaking avoid state in recent partner profile'
          git push origin HEAD:agent/social-safety-replay
