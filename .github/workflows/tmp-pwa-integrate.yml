name: Temporary PWA integrator

on:
  push:
    branches:
      - agent/pwa-mobile-installability

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply PWA integration
        run: node tools/apply-pwa.cjs
      - name: Format changed files
        run: >-
          npx prettier --write
          client/index.html client/manifest.webmanifest client/pwa.css client/pwa-entry.js
          client/core/pwa.js client/service-worker.js client/offline.html
          server/index.js server/pwa.test.mjs server/pwaClient.test.mjs e2e/pwa.spec.js package.json
      - name: Lint
        run: npm run lint
      - name: Targeted and full tests
        run: npm test
      - name: Commit integrated PWA
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            client/index.html client/manifest.webmanifest client/pwa.css client/pwa-entry.js \
            client/core/pwa.js client/service-worker.js client/offline.html client/icons \
            server/index.js server/pwa.test.mjs server/pwaClient.test.mjs e2e/pwa.spec.js package.json
          git commit -m 'Add installable PWA and safe update flow'
          git push
