name: PR95 format session regression

on:
  push:
    branches:
      - agent/race-lobby-grid
    paths:
      - .github/workflows/pr95-format-new-test.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/race-lobby-grid
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format regression and remove helper
        run: |
          npx prettier --write server/raceLobbyGridSession.test.mjs
          rm .github/workflows/pr95-format-new-test.yml
          git diff --check
      - name: Commit final formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format race lobby grid regression"
          git push origin HEAD:agent/race-lobby-grid
