name: Temporary fix player support search

on:
  push:
    branches: [feat/admin-player-support]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-player-support
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rewrite search through a projected CTE
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/adminPlayerSupport.js')
          s = p.read_text()
          old = r'''    search: db.prepare(`
      SELECT
        a.id,
        a.display_name,
        a.created_at,
        a.last_seen_at,
        SUM(CASE WHEN s.expires_at > ? THEN 1 ELSE 0 END) AS active_sessions,
        EXISTS(SELECT 1 FROM account_identities ai WHERE ai.account_id = a.id) AS has_external_login
      FROM accounts a
      LEFT JOIN account_sessions s ON s.account_id = a.id
      WHERE a.id = ?
         OR a.id LIKE ? ESCAPE '\\'
         OR a.display_name LIKE ? ESCAPE '\\'
      GROUP BY a.id, a.display_name, a.created_at, a.last_seen_at
      ORDER BY
        CASE
          WHEN a.id = ? THEN 0
          WHEN a.display_name = ? COLLATE NOCASE THEN 1
          ELSE 2
        END,
        a.last_seen_at DESC,
        a.id ASC
      LIMIT ?
    `),'''
          new = r'''    search: db.prepare(`
      WITH candidates AS (
        SELECT
          a.id AS id,
          a.display_name AS display_name,
          a.created_at AS created_at,
          a.last_seen_at AS last_seen_at,
          SUM(CASE WHEN s.expires_at > ? THEN 1 ELSE 0 END) AS active_sessions,
          EXISTS(SELECT 1 FROM account_identities ai WHERE ai.account_id = a.id) AS has_external_login
        FROM accounts a
        LEFT JOIN account_sessions s ON s.account_id = a.id
        WHERE a.id = ?
           OR a.id LIKE ? ESCAPE '\\'
           OR a.display_name LIKE ? ESCAPE '\\'
        GROUP BY a.id, a.display_name, a.created_at, a.last_seen_at
      )
      SELECT id, display_name, created_at, last_seen_at, active_sessions, has_external_login
      FROM candidates
      ORDER BY
        CASE
          WHEN id = ? THEN 0
          WHEN display_name = ? COLLATE NOCASE THEN 1
          ELSE 2
        END,
        last_seen_at DESC,
        id ASC
      LIMIT ?
    `),'''
          if old not in s:
              raise SystemExit('search SQL anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npx prettier --write server/adminPlayerSupport.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/adminPlayerSupport.js
          git commit -m 'Stabilize player support search query'
          git push origin HEAD:feat/admin-player-support
