name: PR74 durable restart and admission fixes

on:
  push:
    branches: [feat/maintenance-operations]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/maintenance-operations
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Apply reviewed fixes with exact anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              return text.replace(old, new, 1)

          # Installer: an intentional helper stop must be followed by an immediate service start,
          # otherwise a durable restart marker would wait for the next admin socket request.
          install_path = Path('deploy/install.sh')
          install = install_path.read_text()
          install = replace_once(
              install,
              'systemctl restart wobble-ops.socket\n\nsay "Преддеплойная резервная копия"',
              'systemctl restart wobble-ops.socket\n# Start the helper immediately so a persisted graceful-restart monitor is recovered even before\n# another admin request arrives. Restart=on-failure handles an unexpected helper crash afterwards.\nsystemctl start wobble-ops.service\n\nsay "Преддеплойная резервная копия"',
              'installer helper start',
          )
          install_path.write_text(install)

          index_path = Path('server/index.js')
          index = index_path.read_text()

          # Matchmaking must reject drain before leave/queue/match metrics or room creation.
          index = replace_once(
              index,
              'function enqueueCoop(ws, message) {\n  leave(ws);',
              """function enqueueCoop(ws, message) {
                if (operationalState.isDraining()) {
                  send(ws, { type: S2C.SERVER_SHUTDOWN, reason: 'restart' });
                  return false;
                }
                leave(ws);""".replace('                ', ''),
              'matchmaking drain admission',
          )

          next_header = """  if (
            room.mode === GAME_MODE.COOP &&
            enoughPlayers &&
            decided &&
            active.every(player => player.resultChoice === 'next')
          ) {
          """.replace('          ', '')
          next_guard = next_header + """    if (operationalState.isDraining()) {
              broadcast(room, { type: S2C.SERVER_SHUTDOWN, reason: 'restart' });
              return true;
            }
          """.replace('          ', '')
          index = replace_once(index, next_header, next_guard, 'next chapter drain admission')

          rematch_header = """  if (enoughPlayers && decided && active.every(player => player.resultChoice === 'rematch')) {
          """.replace('          ', '')
          rematch_guard = rematch_header + """    if (operationalState.isDraining()) {
              broadcast(room, { type: S2C.SERVER_SHUTDOWN, reason: 'restart' });
              return true;
            }
          """.replace('          ', '')
          index = replace_once(index, rematch_header, rematch_guard, 'rematch drain admission')
          index_path.write_text(index)

          test_path = Path('server/adminOperations.test.mjs')
          tests = test_path.read_text()
          tests = replace_once(
              tests,
              """  ACTIONS,
                MAINTENANCE_FLAG,
                createServer,
                maintenanceEnabled,
                readWobbleOperationalHealth,
                setMaintenance,
                validateRequest
              """.replace('              ', ''),
              """  ACTIONS,
                MAINTENANCE_FLAG,
                RESTART_MARKER,
                clearRestartMarker,
                createServer,
                maintenanceEnabled,
                readRestartMarker,
                readWobbleOperationalHealth,
                setMaintenance,
                validateRequest,
                writeRestartMarker
              """.replace('              ', ''),
              'marker imports',
          )

          marker_test_anchor = """test('operational drain state is process-wide and one-way for the retiring process', () => {
          """.replace('          ', '')
          marker_test = """test('restart monitor state survives helper restart through one fixed durable marker', () => {
            assert.equal(RESTART_MARKER, '/run/wobble-ops/restart.json');
            const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'wobble-restart-marker-test-'));
            const markerPath = path.join(dir, 'restart.json');
            const marker = { version: 1, oldPid: 4321, startedAt: 123456, clearMaintenance: true };
            try {
              assert.equal(readRestartMarker(markerPath), null);
              assert.equal(writeRestartMarker(marker, markerPath), true);
              assert.deepEqual(readRestartMarker(markerPath), marker);
              fs.writeFileSync(markerPath, '{broken json');
              assert.equal(readRestartMarker(markerPath), null);
              assert.equal(writeRestartMarker(marker, markerPath), true);
              assert.equal(clearRestartMarker(markerPath), true);
              assert.equal(readRestartMarker(markerPath), null);
            } finally {
              fs.rmSync(dir, { recursive: true, force: true });
            }
          });

          test('operational drain state is process-wide and one-way for the retiring process', () => {
          """.replace('          ', '')
          tests = replace_once(tests, marker_test_anchor, marker_test, 'restart marker test')

          sandbox_anchor = """  assert.match(helperUnit, /^RuntimeDirectoryPreserve=yes$/m);
          """.replace('          ', '')
          sandbox_extra = sandbox_anchor + """  assert.match(helperUnit, /^Restart=on-failure$/m);
            assert.match(helperUnit, /^RestartSec=1s$/m);
          """.replace('          ', '')
          tests = replace_once(tests, sandbox_anchor, sandbox_extra, 'helper restart assertions')

          restart_source_anchor = """  const helper = fs.readFileSync(path.join(root, 'deploy/wobble-ops-helper.mjs'), 'utf8');
          """.replace('          ', '')
          restart_source_extra = restart_source_anchor + """  const install = fs.readFileSync(path.join(root, 'deploy/install.sh'), 'utf8');
          """.replace('          ', '')
          # Only replace in the operational restart test, not the earlier Nginx test.
          restart_test_at = tests.indexOf("test('operational restart is serialized")
          if restart_test_at < 0:
              raise SystemExit('operational restart test not found')
          tail = tests[restart_test_at:]
          tail = replace_once(tail, restart_source_anchor, restart_source_extra, 'restart installer source')
          tests = tests[:restart_test_at] + tail

          marker_assert_anchor = """  assert.match(helper, /const READY_STREAK_REQUIRED = 3/);
          """.replace('          ', '')
          marker_asserts = marker_assert_anchor + """  assert.match(helper, /export const RESTART_MARKER = '\\/run\\/wobble-ops\\/restart\\.json'/);
            assert.match(helper, /recoverRestartMonitor\\(\\);/);
            const markerWriteAt = helper.indexOf('if (!writeRestartMarker(marker))');
            const signalAt = helper.indexOf("['kill', '--kill-whom=main', '--signal=SIGUSR2', 'wobble.service']");
            assert.ok(markerWriteAt >= 0 && signalAt > markerWriteAt);
            const socketRestartAt = install.indexOf('systemctl restart wobble-ops.socket');
            const helperStartAt = install.indexOf('systemctl start wobble-ops.service');
            assert.ok(socketRestartAt >= 0 && helperStartAt > socketRestartAt);
          """.replace('          ', '')
          tests = replace_once(tests, marker_assert_anchor, marker_asserts, 'durable monitor assertions')

          final_assert_anchor = """  assert.match(helper, /restart timed out; maintenance remains enabled/);
          """.replace('          ', '')
          admission_asserts = final_assert_anchor + """
            const enqueueAt = index.indexOf('function enqueueCoop(ws, message)');
            const enqueueDrainAt = index.indexOf('if (operationalState.isDraining())', enqueueAt);
            const enqueueLeaveAt = index.indexOf('leave(ws);', enqueueAt);
            assert.ok(enqueueAt >= 0 && enqueueDrainAt > enqueueAt && enqueueDrainAt < enqueueLeaveAt);

            const resultsAt = index.indexOf('function resolveResultsDecision(room');
            const nextChoiceAt = index.indexOf("player.resultChoice === 'next'", resultsAt);
            const nextDrainAt = index.indexOf('if (operationalState.isDraining())', nextChoiceAt);
            const nextMutationAt = index.indexOf('room.chapterId = nextChapterId;', nextChoiceAt);
            assert.ok(nextChoiceAt >= 0 && nextDrainAt > nextChoiceAt && nextDrainAt < nextMutationAt);

            const rematchChoiceAt = index.indexOf("player.resultChoice === 'rematch'", resultsAt);
            const rematchDrainAt = index.indexOf('if (operationalState.isDraining())', rematchChoiceAt);
            const rematchMetricAt = index.indexOf("gameplay.count('pair_continued'", rematchChoiceAt);
            assert.ok(
              rematchChoiceAt >= 0 &&
                rematchDrainAt > rematchChoiceAt &&
                rematchDrainAt < rematchMetricAt
            );
          """.replace('          ', '')
          tests = replace_once(tests, final_assert_anchor, admission_asserts, 'admission ordering assertions')
          test_path.write_text(tests)
          PY

          npx prettier --write deploy/wobble-ops-helper.mjs server/index.js server/adminOperations.test.mjs
          git diff --check

      - name: Focused production checks
        shell: bash
        run: |
          set -euo pipefail
          node --check server/index.js
          node --check server/bootstrap.js
          node --test server/adminOperations.test.mjs
          node server/validateDeployScripts.mjs

      - name: Commit reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/install.sh deploy/wobble-ops-helper.mjs server/index.js server/adminOperations.test.mjs
          git commit -m "Recover restart monitor and guard drain side effects"
          git push origin HEAD:feat/maintenance-operations
