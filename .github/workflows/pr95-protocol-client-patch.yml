name: PR95 protocol and client patch

on:
  push:
    branches:
      - agent/race-lobby-grid
    paths:
      - .github/workflows/pr95-protocol-client-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/race-lobby-grid
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact protocol and client patch
        run: |
          node scripts/pr95PatchProtocolClient.mjs
          npx prettier --write shared/protocol.js client/net/networkBindings.js
          rm scripts/pr95PatchProtocolClient.mjs .github/workflows/pr95-protocol-client-patch.yml
          git diff --check
      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Version bot controls and keep grid respawns [skip ci]"
          git push origin HEAD:agent/race-lobby-grid
