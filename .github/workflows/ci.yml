name: Verify Wobble Rush

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wobble-rush-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Быстрые source/server checks не должны делить timeout с real-time Playwright матчами.
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # 22, а не 20: в проекте используется встроенный node:sqlite, он появился в 22.5.
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      # Эти проверки дешёвые и должны падать раньше долгих интеграционных и браузерных сценариев.
      - name: Check formatting and merge artifacts
        run: |
          npm run format:check
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            .; then
            echo "Merge conflict markers found"
            exit 1
          fi

      - name: Validate production scripts
        run: bash -n deploy/install.sh deploy/backup.sh deploy/restore.sh deploy/check-backup.sh deploy/smoke.sh deploy/verify-shared443-config.sh

      - name: Verify shared-443 Nginx configuration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx libnginx-mod-stream
          bash deploy/verify-shared443-config.sh

      - name: Lint source
        run: npm run check

      - name: Run gameplay and multiplayer tests
        run: npm test

      - name: Run production backup and deploy smoke
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          server_log="$tmp_dir/server.log"
          export LEADERBOARD_DB="$tmp_dir/game.db"
          export BACKUP_DIR="$tmp_dir/backups"
          export BACKUP_STATUS_FILE="$tmp_dir/backups/status.json"
          export PORT=3100
          export HOST=127.0.0.1
          export ALLOWED_ORIGINS=http://127.0.0.1:3100
          node server/bootstrap.js >"$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true
            rm -rf "$tmp_dir"
          }
          trap cleanup EXIT

          ready=0
          for _ in {1..50}; do
            if curl -fsS --max-time 1 http://127.0.0.1:3100/health/live >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$server_log"
            exit 1
          fi

          node server/backupCli.mjs create
          if ! SMOKE_URL=http://127.0.0.1:3100 \
            SMOKE_ORIGIN=http://127.0.0.1:3100 \
            bash deploy/smoke.sh --require-backup; then
            cat "$server_log"
            exit 1
          fi

  browser:
    needs: verify
    runs-on: ubuntu-latest
    # Playwright включает real-time full-match/performance сценарии и получает собственный бюджет.
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run browser test suite
        run: npm run test:e2e

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Сохраняем прежнее имя обязательного check `test`: он зелёный только после обоих слоёв.
  test:
    if: ${{ always() }}
    needs: [verify, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require verification jobs
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$BROWSER_RESULT" = success
