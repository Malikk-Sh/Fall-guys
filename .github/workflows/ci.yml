name: Verify Wobble Rush

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wobble-rush-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Print canonical signature formatting
        run: |
          npx prettier --write client/game/CoopController.js server/signatureCoopState.test.mjs
          git diff -- client/game/CoopController.js server/signatureCoopState.test.mjs
          exit 1
