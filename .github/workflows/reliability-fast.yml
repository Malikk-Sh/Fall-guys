name: Reliability fast validation

on:
  push:
    branches: [feat/reliability-center]

permissions:
  contents: write

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply canonical formatting
        run: >-
          npx prettier --write
          client/admin/index.html
          client/admin/reliability.js
          docs/RELIABILITY-CENTER.md
          package.json
          server/adminAuth.js
          server/adminReliabilityRoutes.js
          server/bootstrap.js
          server/migrations.test.mjs
          server/migrations/015_service_reliability.js
          server/migrations/index.js
          server/reliability.test.mjs
          server/reliabilityCapture.js
          server/serviceReliability.js

      - name: Lint changed JavaScript
        run: >-
          npx eslint
          client/admin/reliability.js
          server/adminAuth.js
          server/adminReliabilityRoutes.js
          server/bootstrap.js
          server/migrations.test.mjs
          server/migrations/015_service_reliability.js
          server/migrations/index.js
          server/reliability.test.mjs
          server/reliabilityCapture.js
          server/serviceReliability.js

      - name: Run targeted reliability and migration tests
        run: node --test server/reliability.test.mjs server/migrations.test.mjs

      - name: Commit formatter output if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formatting already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/admin/index.html \
            client/admin/reliability.js \
            docs/RELIABILITY-CENTER.md \
            package.json \
            server/adminAuth.js \
            server/adminReliabilityRoutes.js \
            server/bootstrap.js \
            server/migrations.test.mjs \
            server/migrations/015_service_reliability.js \
            server/migrations/index.js \
            server/reliability.test.mjs \
            server/reliabilityCapture.js \
            server/serviceReliability.js
          git commit -m "Format reliability center changes"
          git push origin HEAD:feat/reliability-center
