name: PR82 Telegram one-shot verification gate

on:
  push:
    branches: [feat/telegram-alert-delivery]

permissions:
  contents: write

concurrency:
  group: pr82-telegram-test-unit
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/telegram-alert-delivery
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply one-shot production integration
        run: python scripts/pr82-test-unit-finalize.py

      - name: Format and lint
        run: |
          npx prettier --write \
            server/telegramAlertTest.js \
            server/telegramAlertTest.test.mjs \
            server/telegramAlertProduction.test.mjs \
            docs/TELEGRAM-ALERT-DELIVERY.md \
            package.json \
            .github/workflows/pr82-test-unit-gate.yml
          npm run format:check
          npm run check
          git diff --check
          bash -n deploy/install.sh

      - name: Focused Telegram regressions
        run: |
          node --test \
            server/telegramAlertDelivery.test.mjs \
            server/telegramAlertTest.test.mjs \
            server/telegramAlertProduction.test.mjs \
            server/controlPlaneDeploy.test.mjs \
            server/controlPlaneAlerts.test.mjs

      - name: Verify one-shot boundary
        run: |
          grep -q '^Type=oneshot$' deploy/wobble-telegram-alert-test.service
          grep -q '^DynamicUser=yes$' deploy/wobble-telegram-alert-test.service
          grep -q '^EnvironmentFile=/etc/wobble-telegram.env$' deploy/wobble-telegram-alert-test.service
          ! grep -q 'wobble-ops.sock' deploy/wobble-telegram-alert-test.service
          ! grep -q 'LEADERBOARD_DB' deploy/wobble-telegram-alert-test.service
          grep -q 'wobble-telegram-alert-test.service' deploy/install.sh
          ! grep -q 'systemctl enable wobble-telegram-alert-test' deploy/install.sh

      - name: Persist checked one-shot verification and remove temporary gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/pr82-test-unit-finalize.py .github/workflows/pr82-test-unit-gate.yml
          git add \
            server/telegramAlertTest.js \
            server/telegramAlertTest.test.mjs \
            server/telegramAlertProduction.test.mjs \
            deploy/wobble-telegram-alert-test.service \
            deploy/install.sh \
            docs/TELEGRAM-ALERT-DELIVERY.md \
            package.json
          git commit -m 'Add safe Telegram delivery verification action'
          git push origin HEAD:feat/telegram-alert-delivery
