# HTTP side of shared-443 deployment.
# External :443 belongs to Nginx stream (nginx-shared443-stream.conf). It routes TLS with
# SNI=example.com to this loopback-only TLS listener; users never see :8443.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Backend is intentionally loopback-only. Public traffic reaches it only through stream :443.
    listen 127.0.0.1:8443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/wobble-locations.conf;

    gzip on;
    gzip_types application/javascript text/css application/json;
    gzip_min_length 1024;
    client_max_body_size 64k;
}
