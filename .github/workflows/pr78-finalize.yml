name: PR78 final architecture gate

on:
  push:
    branches:
      - feat/resilient-control-plane

permissions:
  contents: write

jobs:
  focused:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resilient-control-plane
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply final architecture hardening
        run: python scripts/pr78-finalize.py
      - name: Canonical formatting
        run: |
          npx prettier --write \
            client/admin/admin.js \
            docs/RESILIENT-CONTROL-PLANE.md \
            server/adminAuth.js \
            server/controlPlane.js \
            server/controlPlaneGameClient.js \
            server/controlPlaneGameClient.test.mjs \
            server/controlPlaneInfrastructure.js \
            server/controlPlaneRoutes.js \
            server/controlPlaneRoutes.test.mjs \
            server/serviceReliabilityReader.js \
            server/serviceReliabilityReader.test.mjs
          npm run format:check
      - name: Lint and production syntax
        run: |
          npm run check
          bash -n deploy/install.sh deploy/backup.sh deploy/restore.sh deploy/check-backup.sh deploy/smoke.sh deploy/verify-shared443-config.sh
          bash deploy/verify-shared443-config.sh
      - name: Focused regression tests
        run: |
          node --test \
            server/controlPlaneGameClient.test.mjs \
            server/controlPlaneRoutes.test.mjs \
            server/serviceReliabilityReader.test.mjs \
            server/adminControlPlane.test.mjs \
            server/adminInfrastructure.test.mjs \
            server/adminOperations.test.mjs \
            server/reliability.test.mjs
      - name: Prove Control Plane survives gameplay loss
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          game_log="$tmp_dir/game.log"
          control_log="$tmp_dir/control.log"
          export LEADERBOARD_DB="$tmp_dir/game.db"
          export BACKUP_DIR="$tmp_dir/backups"
          export BACKUP_STATUS_FILE="$tmp_dir/backups/status.json"
          export PORT=3210
          export HOST=127.0.0.1
          export CONTROL_PORT=3211
          export ALLOWED_ORIGINS=http://127.0.0.1:3210
          export ADMIN_PANEL_ENABLED=1
          export NODE_ENV=test
          game_pid=''
          control_pid=''
          cleanup() {
            if [ -n "$control_pid" ]; then kill "$control_pid" >/dev/null 2>&1 || true; fi
            if [ -n "$game_pid" ]; then kill "$game_pid" >/dev/null 2>&1 || true; fi
            if [ -n "$control_pid" ]; then wait "$control_pid" >/dev/null 2>&1 || true; fi
            if [ -n "$game_pid" ]; then wait "$game_pid" >/dev/null 2>&1 || true; fi
            rm -rf "$tmp_dir"
          }
          trap cleanup EXIT

          node server/bootstrap.js >"$game_log" 2>&1 &
          game_pid=$!
          game_ready=0
          for _ in {1..50}; do
            if curl -fsS --max-time 1 http://127.0.0.1:3210/health/live >/dev/null 2>&1; then
              game_ready=1
              break
            fi
            sleep 0.1
          done
          if [ "$game_ready" -ne 1 ]; then cat "$game_log"; exit 1; fi

          admin_json="$(node server/adminCli.mjs --db "$LEADERBOARD_DB" create --name GateOwner --role owner)"
          access_code="$(ADMIN_JSON="$admin_json" node -e "process.stdout.write(JSON.parse(process.env.ADMIN_JSON).accessCode)")"

          node server/controlPlane.js >"$control_log" 2>&1 &
          control_pid=$!
          control_ready=0
          for _ in {1..50}; do
            if curl -fsS --max-time 1 http://127.0.0.1:3211/health/control >/dev/null 2>&1; then
              control_ready=1
              break
            fi
            sleep 0.1
          done
          if [ "$control_ready" -ne 1 ]; then cat "$control_log"; exit 1; fi

          kill "$game_pid"
          wait "$game_pid" || true
          game_pid=''
          curl -fsS --max-time 2 http://127.0.0.1:3211/health/control >/dev/null

          login_status="$(curl -sS --max-time 2 -o "$tmp_dir/login.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data "{\"accessCode\":\"$access_code\"}" \
            http://127.0.0.1:3211/api/admin/login)"
          if [ "$login_status" != '200' ]; then
            cat "$tmp_dir/login.json"
            cat "$control_log"
            exit 1
          fi
          node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync(process.argv[1])); if(!v.ok||v.admin?.role!=='owner') process.exit(1)" "$tmp_dir/login.json"
      - name: Static dependency and exposure checks
        run: |
          grep -Fq 'ExecStart=/usr/bin/node server/controlPlane.js' deploy/wobble-control.service
          ! grep -Eq '^(Requires|PartOf)=wobble\.service' deploy/wobble-control.service
          grep -Fq "const host = '127.0.0.1';" server/controlPlane.js
          grep -Fq 'ufw delete allow 3001/tcp' deploy/install.sh
          grep -Fq 'proxy_pass http://127.0.0.1:3001;' deploy/nginx-locations.conf
          grep -Fq 'location ~* ^/health/control$' deploy/nginx-locations.conf
          ! grep -Fq 'window.location.reload(), 4500' client/admin/admin.js
      - name: Persist checked tree and remove temporary gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/admin/admin.js docs/RESILIENT-CONTROL-PLANE.md server/adminAuth.js server/controlPlane.js server/controlPlaneGameClient.js server/controlPlaneGameClient.test.mjs server/controlPlaneInfrastructure.js server/controlPlaneRoutes.js server/controlPlaneRoutes.test.mjs server/serviceReliabilityReader.js server/serviceReliabilityReader.test.mjs
          git rm .github/workflows/pr78-finalize.yml scripts/pr78-finalize.py
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize resilient control plane architecture'
            git push origin HEAD:feat/resilient-control-plane
          fi
