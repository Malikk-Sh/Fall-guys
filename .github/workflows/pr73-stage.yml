name: Stage PR73 player sanctions

on:
  push:
    branches:
      - feat/player-sanctions

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/player-sanctions
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply sanctions integration patch
        run: |
          python3 scripts/pr73_patch.py
          python3 scripts/pr73_control_fix.py
          python3 scripts/pr73_test_fixes.py

      - name: Format changed source
        run: |
          npx prettier --write \
            server/migrations/013_player_sanctions.js \
            server/migrations/index.js \
            server/migrations.test.mjs \
            server/playerSanctions.js \
            server/playerSanctions.test.mjs \
            server/adminSanctions.test.mjs \
            server/authSanctions.test.mjs \
            server/networkSanctions.test.mjs \
            server/networkIdentity.js \
            server/adminAuth.js \
            server/adminControl.js \
            server/adminRoutes.js \
            server/authRoutes.js \
            server/bootstrap.js \
            client/core/account.js \
            client/core/AccountFlow.js \
            client/admin/index.html \
            client/admin/admin.js \
            client/admin/admin.css \
            package.json

      - name: Validate syntax and lint
        run: |
          node --check server/playerSanctions.js
          node --check server/adminControl.js
          node --check server/adminRoutes.js
          node --check server/authRoutes.js
          node --check server/bootstrap.js
          node --check server/networkIdentity.js
          node --check client/admin/admin.js
          npx eslint \
            server/playerSanctions.js \
            server/networkIdentity.js \
            server/adminAuth.js \
            server/adminControl.js \
            server/adminRoutes.js \
            server/authRoutes.js \
            server/bootstrap.js \
            client/admin/admin.js

      - name: Run sanctions and regression tests
        run: |
          node --test \
            server/playerSanctions.test.mjs \
            server/adminSanctions.test.mjs \
            server/authSanctions.test.mjs \
            server/networkSanctions.test.mjs \
            server/adminModeration.test.mjs \
            server/adminControlPlane.test.mjs \
            server/adminPlayerSupport.test.mjs \
            server/adminPlayerSupportRoutes.test.mjs \
            server/auth.test.mjs \
            server/networkIdentity.test.mjs \
            server/socketAuthProtocol.test.mjs \
            server/socketAuthIntegration.test.mjs \
            server/migrations.test.mjs

      - name: Commit staged implementation and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/pr73_patch.py scripts/pr73_control_fix.py scripts/pr73_test_fixes.py .github/workflows/pr73-stage.yml
          git add -A
          git diff --cached --check
          git commit -m "Add server-enforced player sanctions"
          git push origin HEAD:feat/player-sanctions
