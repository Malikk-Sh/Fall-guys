name: PR74 Final Review Fixes

on:
  push:
    branches: [feat/maintenance-operations]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/maintenance-operations
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply final Codex review fixes
        run: python3 .github/pr74-final-review-fixes.py

      - name: Format focused changes
        run: npx prettier --write server/index.js server/bootstrap.js deploy/wobble-ops-helper.mjs server/adminOperations.test.mjs

      - name: Run focused operation tests
        run: node --test server/adminOperations.test.mjs

      - name: Lint focused changes
        run: npx eslint server/index.js server/bootstrap.js deploy/wobble-ops-helper.mjs server/adminOperations.test.mjs

      - name: Run full unit and integration suite
        run: npm test

      - name: Commit fixes and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr74-final-review-fixes.yml .github/pr74-final-review-fixes.py
          git add server/index.js server/bootstrap.js deploy/wobble-ops-helper.mjs server/adminOperations.test.mjs
          git diff --cached --check
          git config user.name "Malik"
          git config user.email "93332098+Malikk-Sh@users.noreply.github.com"
          git commit -m "Resolve final PR74 Codex review"
          git push origin HEAD:feat/maintenance-operations
