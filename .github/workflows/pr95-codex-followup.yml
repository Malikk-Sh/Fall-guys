name: PR95 second Codex follow-up

on:
  push:
    branches:
      - agent/race-lobby-grid
    paths:
      - .github/workflows/pr95-codex-followup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/race-lobby-grid
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Codex follow-up
        run: |
          node scripts/pr95CodexFollowup.mjs
          npx prettier --write server/index.js server/roomBots.js server/raceSlots.js server/raceSlots.test.mjs server/raceBotGridRespawn.test.mjs package.json
          rm scripts/pr95CodexFollowup.mjs .github/workflows/pr95-codex-followup.yml
          git diff --check
      - name: Commit fixes and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Address second Codex review on race grid [skip ci]"
          git push origin HEAD:agent/race-lobby-grid
