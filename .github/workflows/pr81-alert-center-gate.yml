name: PR81 Alert Center gate

on:
  push:
    branches:
      - feat/operator-alert-center

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operator-alert-center
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Alert Center integration
        run: python scripts/pr81-integrate-alert-center.py
      - name: Canonical formatting and lint
        run: |
          npx prettier --write \
            server/controlPlaneAlerts.js \
            server/controlPlaneAlerts.test.mjs \
            server/controlPlane.js \
            server/adminAuth.js \
            server/controlPlaneRoutes.js \
            server/controlPlaneRoutes.test.mjs \
            server/adminControlPlane.test.mjs \
            server/controlPlaneDeploy.test.mjs \
            client/admin/alerts.js \
            client/admin/admin.js \
            client/admin/index.html \
            docs/ALERT-CENTER.md \
            package.json
          npm run format:check
          npm run check
          git diff --check
      - name: Focused Alert Center regressions
        run: |
          node --test \
            server/controlPlaneAlerts.test.mjs \
            server/controlPlaneRoutes.test.mjs \
            server/adminControlPlane.test.mjs \
            server/controlPlaneDeploy.test.mjs \
            server/serviceReliabilityReader.test.mjs \
            server/adminInfrastructure.test.mjs \
            server/durableOperations.test.mjs
      - name: Verify production boundary
        run: |
          grep -Fq "StateDirectory=wobble-control" deploy/wobble-control.service
          grep -Fq "CONTROL_ALERT_STATE=/var/lib/wobble-control/alerts.json" deploy/wobble-control.service
          grep -Fq "alerts.start();" server/controlPlane.js
          grep -Fq "alerts.stop();" server/controlPlane.js
          grep -Fq "'/api/admin/alerts/status'" server/controlPlaneRoutes.js
          grep -Fq "'/api/admin/alerts/acknowledge'" server/controlPlaneRoutes.js
          grep -Fq "'alerts.read'" server/adminAuth.js
          grep -Fq "'alerts.ack'" server/adminAuth.js
          grep -Fq '/admin/alerts.js' client/admin/index.html
          grep -Fq 'server/controlPlaneAlerts.test.mjs' package.json
      - name: Persist checked Alert Center and remove temporary gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            server/controlPlaneAlerts.js \
            server/controlPlaneAlerts.test.mjs \
            server/controlPlane.js \
            server/adminAuth.js \
            server/controlPlaneRoutes.js \
            server/controlPlaneRoutes.test.mjs \
            server/adminControlPlane.test.mjs \
            server/controlPlaneDeploy.test.mjs \
            client/admin/alerts.js \
            client/admin/admin.js \
            client/admin/index.html \
            deploy/wobble-control.service \
            docs/ALERT-CENTER.md \
            package.json
          git rm .github/workflows/pr81-alert-center-gate.yml scripts/pr81-integrate-alert-center.py
          git commit -m 'Add resilient operator Alert Center'
          git push origin HEAD:feat/operator-alert-center
