name: PR76 Incident Center Stage

on:
  push:
    branches: [feat/live-incident-diagnostics]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/live-incident-diagnostics
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply observability fail-safe hardening
        run: python3 tools/pr76_observability_hardening.py

      - name: Format hardening changes
        run: npx prettier --write server/index.js server/socketAuthIntegration.test.mjs

      - name: Run focused diagnostics and socket tests
        run: |
          node --test \
            server/incidentDiagnostics.test.mjs \
            server/adminIncidentRoutes.test.mjs \
            server/networkSanctions.test.mjs \
            server/socketAuthIntegration.test.mjs

      - name: Lint source
        run: npm run check

      - name: Run full unit and integration suite
        run: npm test

      - name: Commit verified hardening
        run: |
          set -euo pipefail
          git restore tools/pr76_observability_hardening.py .github/workflows/pr76-incident-center-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No verified hardening changes to commit.' >&2
            exit 1
          fi
          git commit -m 'Keep incident diagnostics fail-safe'
          git push origin HEAD:feat/live-incident-diagnostics
