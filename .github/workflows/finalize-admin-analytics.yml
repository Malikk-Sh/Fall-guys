name: Temporary finalize admin analytics

on:
  push:
    branches: [feat/admin-analytics-usability]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/admin-analytics-usability
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply final UX safeguards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('client/admin/admin.js')
          text = path.read_text()
          text = text.replace(
          """function formatDay(value) {
            if (!value) return '—';
            return new Intl.DateTimeFormat('ru-RU', { day: '2-digit', month: '2-digit' }).format(
              new Date(`${value}T00:00:00Z`)
            );
          }""",
          """function formatDay(value) {
            const match = /^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(String(value || ''));
            return match ? `${match[3]}.${match[2]}` : '—';
          }"""
          )
          text = text.replace(
          """  const current = data.kpis?.current || {};
            const previous = data.kpis?.previous || {};
            const completion = current.completionPercent == null ? '—' : `${current.completionPercent}%`;
            const previousCompletion = previous.completionPercent == null ? '—' : `${previous.completionPercent}%`;""",
          """  const current = data.kpis?.current || {};
            const previous = data.kpis?.previous || null;
            const comparisonAvailable = data.comparisonAvailable !== false;
            const completion = current.completionPercent == null ? '—' : `${current.completionPercent}%`;
            const previousCompletion = previous?.completionPercent == null ? '—' : `${previous.completionPercent}%`;
            const comparisonUnavailableHint = `полное сравнение недоступно: метрики хранятся ${formatNumber(data.retentionDays)} дней`;"""
          )
          text = text.replace(
          """      `прошлый такой же период: ${previousCompletion} · это отношение событий, не уникальных игроков`""",
          """      `${comparisonAvailable ? `прошлый такой же период: ${previousCompletion}` : comparisonUnavailableHint} · это отношение событий, не уникальных игроков`"""
          )
          text = text.replace(
          """      `прошлый период: ${formatMilliseconds(previous.verifiedAverageMs)} · проверенных финишей: ${formatNumber(current.verifiedFinishes)}`""",
          """      `${comparisonAvailable ? `прошлый период: ${formatMilliseconds(previous?.verifiedAverageMs)}` : comparisonUnavailableHint} · проверенных финишей: ${formatNumber(current.verifiedFinishes)}`"""
          )
          text = text.replace(
          """  const limitNote = data.truncated ? ' · таблица ограничена первыми 1000 строками' : '';
            const droppedNote = data.dropped""",
          """  const limitNote = data.truncated ? ' · таблица ограничена первыми 1000 строками' : '';
            const comparisonNote = data.comparisonAvailable
              ? ` · сравнение с ${data.previousFrom}–${data.previousTo}`
              : ` · предыдущий полный период не сравнивается: история хранится ${formatNumber(data.retentionDays)} дней`;
            const droppedNote = data.dropped"""
          )
          text = text.replace(
          """  $('#analytics-meta').textContent =
              `Период с ${data.from} · сравнение с ${data.previousFrom}–${data.previousTo}${limitNote}${droppedNote}`;""",
          """  $('#analytics-meta').textContent =
              `Период с ${data.from}${comparisonNote}${limitNote}${droppedNote}`;"""
          )
          text = text.replace(
          """function csvCell(value) {
            const text = String(value ?? '');
            return /[\",\\n]/.test(text) ? `\"${text.replaceAll('\"', '\"\"')}\"` : text;
          }""",
          """function csvCell(value) {
            const text = String(value ?? '');
            // Spreadsheet applications may interpret leading =,+,-,@ as a formula. Exported
            // dimensions are data, never formulas, so neutralize them before CSV quoting.
            const safe = /^[=+\\-@]/.test(text) ? `'${text}` : text;
            return /[\",\\n]/.test(safe) ? `\"${safe.replaceAll('\"', '\"\"')}\"` : safe;
          }"""
          )
          text = text.replace(
          """  downloadText(`wobble-analytics-${stamp}.csv`, `${lines.join('\\n')}\\n`, 'text/csv;charset=utf-8');""",
          """  downloadText(
              `wobble-analytics-${stamp}.csv`,
              `\\uFEFF${lines.join('\\n')}\\n`,
              'text/csv;charset=utf-8'
            );"""
          )
          path.write_text(text)

          docs = Path('docs/ADMIN-PANEL.md')
          content = docs.read_text().replace("\n dismissed  -> Отклонено\n", "\ndismissed  -> Отклонено\n")
          content = content.replace(
            "- сравнение каждого основного показателя с предыдущим периодом такой же длины;",
            "- сравнение каждого основного показателя с предыдущим периодом такой же длины, когда полный предыдущий период помещается в 90-дневное окно хранения;"
          )
          content = content.replace(
            "`finished / started` — это отношение обезличенных событий, а не strict unique-player funnel.",
            "Для 90-дневного периода панель честно отключает сравнение с предыдущими 90 днями: gameplay metrics хранятся только 90 дней, поэтому полного предыдущего окна уже нет.\n\n`finished / started` — это отношение обезличенных событий, а не strict unique-player funnel."
          )
          docs.write_text(content)
          PY

      - name: Format changed files
        run: |
          npx prettier --write \
            client/admin/admin.js \
            docs/ADMIN-PANEL.md \
            server/adminAnalytics.js \
            server/adminAnalytics.test.mjs

      - name: Commit finalized files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/admin/admin.js docs/ADMIN-PANEL.md server/adminAnalytics.js server/adminAnalytics.test.mjs
          git commit -m 'Finalize admin analytics safeguards'
          git push origin HEAD:feat/admin-analytics-usability
