name: Temporary PR216 review fix

on:
  push:
    branches:
      - agent/tmp-fix216-transition-review

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tmp-fix216-transition-review
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/fix216-review-temp.py
      - run: npx prettier --write server/movementAudit.js server/sustainedSpeedMeasurement.test.mjs docs/ANALYTICS.md
      - run: node --experimental-loader ./server/client-loader.mjs --test server/sustainedSpeedMeasurement.test.mjs
      - run: npx prettier --check server/movementAudit.js server/sustainedSpeedMeasurement.test.mjs docs/ANALYTICS.md
      - name: Commit review fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/movementAudit.js server/sustainedSpeedMeasurement.test.mjs docs/ANALYTICS.md
          git commit -m 'fix: exclude ambiguous movement state transitions'
          git push origin HEAD:agent/tmp-fix216-transition-review
