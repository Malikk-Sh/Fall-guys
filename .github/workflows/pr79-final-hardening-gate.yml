name: PR79 final durability hardening gate

on:
  push:
    branches:
      - fix/pr79-codex-review

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr79-codex-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply final hardening
        run: python scripts/pr79-final-hardening.py
      - name: Format and lint
        run: |
          npx prettier --write deploy/wobble-ops-helper.mjs server/durableOperations.test.mjs
          npm run format:check
          npm run check
          git diff --check
      - name: Focused durable operations regressions
        run: |
          node --test \
            server/durableOperations.test.mjs \
            server/adminOperations.test.mjs \
            server/controlPlaneRoutes.test.mjs
      - name: Verify final durability contracts
        run: |
          grep -Fq "durationMs = value?.durationMs == null ? null" deploy/wobble-ops-helper.mjs
          grep -Fq "reason: 'restart-signal-failed'" deploy/wobble-ops-helper.mjs
          grep -Fq "reason: 'operation-state-uncertain'" deploy/wobble-ops-helper.mjs
      - name: Persist checked hardening and remove temporary gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/wobble-ops-helper.mjs server/durableOperations.test.mjs
          git rm .github/workflows/pr79-final-hardening-gate.yml scripts/pr79-final-hardening.py
          git commit -m 'Preserve in-flight duration and rollback ordering'
          git push origin HEAD:fix/pr79-codex-review
