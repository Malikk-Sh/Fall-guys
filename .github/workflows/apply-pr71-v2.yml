name: Apply PR71 integration v2

on:
  push:
    branches:
      - feat/admin-infrastructure-status
    paths:
      - .github/workflows/apply-pr71-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-infrastructure-status
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix temporary patch script for two matching roles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/apply-pr71.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('# Role capability:')
          end = text.index('# Wire the read-only infrastructure model')
          replacement = '''# Role capability: host-level status is deliberately owner/operator only.\nfile = ROOT / 'server/adminAuth.js'\ntext = file.read_text(encoding='utf-8')\nold = "    'dashboard.read',\\n    'analytics.read',"\nnew = "    'dashboard.read',\\n    'infrastructure.read',\\n    'analytics.read',"\nif text.count(old) != 2:\n    raise SystemExit(f'server/adminAuth.js: expected two role matches, found {text.count(old)}')\nfile.write_text(text.replace(old, new, 2), encoding='utf-8')\n\n'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
      - run: python3 .github/apply-pr71.py
      - name: Format changed source
        run: |
          npx prettier --write \
            server/adminAuth.js \
            server/bootstrap.js \
            server/adminRoutes.js \
            server/adminInfrastructure.js \
            server/adminInfrastructure.test.mjs \
            client/admin/index.html \
            client/admin/admin.js \
            docs/README.md \
            docs/ADMIN-PANEL.md \
            docs/INFRASTRUCTURE-STATUS.md \
            package.json
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server client docs package.json
          git commit -m "Integrate read-only infrastructure status into Wobble Control"
          git push origin HEAD:feat/admin-infrastructure-status
