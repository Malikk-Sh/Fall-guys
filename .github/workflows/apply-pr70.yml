name: Apply PR70 integration

on:
  push:
    branches:
      - feat/admin-safe-operations
    paths:
      - .github/workflows/apply-pr70.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-safe-operations
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 .github/apply-pr70.py
      - name: Format changed source
        run: |
          npx prettier --write \
            server/bootstrap.js \
            server/adminRoutes.js \
            server/adminOperationsClient.js \
            server/adminOperations.test.mjs \
            server/verifyLatestBackup.mjs \
            deploy/wobble-ops-helper.mjs \
            client/admin/index.html \
            client/admin/admin.js \
            docs/ADMIN-PANEL.md \
            package.json
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server client deploy docs package.json
          git commit -m "Integrate safe operations into Wobble Control"
          git push origin HEAD:feat/admin-safe-operations
