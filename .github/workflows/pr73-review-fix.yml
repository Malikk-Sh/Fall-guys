name: Validate PR73 review fixes

on:
  push:
    branches:
      - feat/player-sanctions

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/player-sanctions
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply Codex review fixes
        run: python3 scripts/pr73_review_fixes.py

      - name: Format changed source
        run: |
          npx prettier --write \
            shared/protocol.js \
            client/net/NetworkManager.js \
            client/core/AccountFlow.js \
            server/index.js \
            server/bootstrap.js \
            server/accountAccessPolicy.js \
            server/playerSanctions.js \
            server/adminControl.js \
            server/playerSanctions.test.mjs \
            server/legacySanctions.test.mjs \
            server/networkManagerSanctions.test.mjs \
            package.json

      - name: Validate syntax and lint
        run: |
          node --check server/index.js
          node --check server/bootstrap.js
          node --check server/accountAccessPolicy.js
          node --check server/playerSanctions.js
          node --check server/adminControl.js
          npx eslint \
            server/index.js \
            server/bootstrap.js \
            server/accountAccessPolicy.js \
            server/playerSanctions.js \
            server/adminControl.js

      - name: Run sanctions bypass and regression tests
        run: |
          node --test \
            server/playerSanctions.test.mjs \
            server/adminSanctions.test.mjs \
            server/authSanctions.test.mjs \
            server/networkSanctions.test.mjs \
            server/networkManagerSanctions.test.mjs \
            server/legacySanctions.test.mjs \
            server/adminModeration.test.mjs \
            server/adminControlPlane.test.mjs \
            server/auth.test.mjs \
            server/networkIdentity.test.mjs \
            server/socketAuthProtocol.test.mjs \
            server/socketAuthIntegration.test.mjs \
            server/migrations.test.mjs
          node --experimental-loader ./server/client-loader.mjs --test \
            server/network.test.mjs \
            server/networkClientAuth.test.mjs \
            server/account.client.test.mjs

      - name: Commit fixes and remove staging helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/pr73_review_fixes.py .github/workflows/pr73-review-fix.yml
          git add -A
          git diff --cached --check
          git commit -m "Close player sanction bypasses"
          git push origin HEAD:feat/player-sanctions
