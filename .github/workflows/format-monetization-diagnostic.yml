name: Format Monetization Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Print exact Prettier result
        run: |
          npx prettier --write docs/MONETIZATION.md
          echo 'FORMATTED_MONETIZATION_BEGIN'
          base64 -w0 docs/MONETIZATION.md
          echo
          echo 'FORMATTED_MONETIZATION_END'
          exit 1
