# Nginx для Wobble Rush 3D.
#
# Копировать в /etc/nginx/sites-available/wobble и заменить example.com на свой домен.
# Затем: ln -s /etc/nginx/sites-available/wobble /etc/nginx/sites-enabled/
#
# HTTPS здесь ещё нет — его допишет certbot (см. docs/DEPLOY.md). Сначала поднимаем по HTTP,
# убеждаемся, что игра работает, и только потом выпускаем сертификат.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Игра целиком отдаётся одним Node-процессом: и статика, и WebSocket на /ws.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Кэширование на стороне прокси НЕ добавлять.
        #
        # Имена файлов клиента без хеша, а версия протокола у клиента и сервера обязана совпадать.
        # Закэшированный на прокси клиент после обновления будет говорить со свежим сервером
        # старыми сообщениями, и сбои начнут выглядеть случайными. Заголовки приложение выставляет
        # само: no-cache для клиента и shared/, длинный кэш только для /vendor.
        proxy_cache off;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Больше, чем период heartbeat сервера (15 с), иначе прокси будет рвать живые соединения
        # игроков, которые просто стоят на месте.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;

        # Буферизация ответов ломает интерактивность сокета: пакеты должны уходить сразу.
        proxy_buffering off;
    }

    # Проверки живости — только изнутри, наружу их отдавать незачем: в /health видны метрики.
    location /health {
        proxy_pass http://127.0.0.1:3000;
        allow 127.0.0.1;
        deny all;
    }

    # Игра сама сжимается плохо (почти всё — JS), но включить стоит: клиент весит ~100 КБ текста.
    gzip on;
    gzip_types application/javascript text/css text/html application/json;
    gzip_min_length 1024;

    # Загрузок нет, но ограничение защищает от мусора в теле запроса.
    client_max_body_size 64k;
}
