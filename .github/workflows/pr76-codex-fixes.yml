name: PR76 Codex Review Fixes

on:
  push:
    branches: [feat/live-incident-diagnostics]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/live-incident-diagnostics
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Repair review-fix selector
        run: python3 tools/pr76_codex_selector_repair.py

      - name: Apply Codex review fixes
        run: python3 tools/pr76_codex_fixes.py

      - name: Format changed source
        run: |
          npx prettier --write \
            server/incidentDiagnostics.js \
            server/incidentDiagnostics.test.mjs \
            server/index.js \
            server/backup.js \
            server/backup.test.mjs \
            server/socketAuthIntegration.test.mjs \
            client/admin/admin.js

      - name: Run focused review regressions
        run: |
          node --test \
            server/incidentDiagnostics.test.mjs \
            server/backup.test.mjs \
            server/socketAuthIntegration.test.mjs \
            server/networkSanctions.test.mjs \
            server/adminIncidentRoutes.test.mjs \
            server/adminOperations.test.mjs \
            server/migrations.test.mjs

      - name: Lint source
        run: npm run check

      - name: Run full unit and integration suite
        run: npm test

      - name: Commit verified review fixes
        run: |
          set -euo pipefail
          git restore tools/pr76_codex_fixes.py tools/pr76_codex_selector_repair.py .github/workflows/pr76-codex-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No verified review changes to commit.' >&2
            exit 1
          fi
          git commit -m 'Address Incident Center review findings'
          git push origin HEAD:feat/live-incident-diagnostics
