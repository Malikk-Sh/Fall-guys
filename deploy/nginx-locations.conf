# Общая часть конфигурации Nginx для Wobble Rush 3D.
#
# Подключается через include из server-блока — и в обычном варианте (порт 443 свободен),
# и в варианте с занятым 443. Так правила проксирования лежат в одном месте и не расходятся
# между двумя конфигами.
#
# Скрипт установки кладёт этот файл в /etc/nginx/wobble-locations.conf.

# Wobble Control живёт отдельно от gameplay process. Поэтому админка остаётся доступной, когда
# wobble.service перезапускается, drain-ится или остановлен для диагностики.
location = /admin {
    # В shared-443 режиме реальный TLS listener Wobble может быть внутренним :18443. Nginx по
    # умолчанию превращает относительный return в абсолютный Location и раскрывает этот порт.
    # Оставляем Location строго относительным: внешний клиент всегда останется на public :443.
    absolute_redirect off;
    return 308 /admin/;
}

# Не отправляем канонический /admin/ в Express route matching: Express 4 без strict routing считает
# /admin и /admin/ одним route и redirect-handler может зациклить /admin/ -> /admin/.
# Проксируем entry document напрямую; остальные /admin/* assets идут обычным location ниже.
location = /admin/ {
    proxy_pass http://127.0.0.1:3001/admin/index.html;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}

location ^~ /admin/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}

location ^~ /api/admin/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Некоторые allowlisted operations могут ждать systemd/helper дольше обычного HTTP-запроса.
    proxy_read_timeout 150s;
    proxy_send_timeout 150s;
    proxy_buffering off;
}

# Express route matching is case-insensitive by default. Lower-case ^~ locations above are the only
# public spellings we accept; case variants must not fall through to gameplay on :3000.
location ~* ^/api/admin(?:/|$) {
    return 404;
}
location ~* ^/admin(?:/|$) {
    return 404;
}

# Internal Control Plane feeds are process-to-process APIs on loopback only. Keep an explicit public
# deny so a future gameplay route with the same prefix cannot accidentally make one reachable.
location ~* ^/internal(?:/|$) {
    return 404;
}

# Игра и публичные HTTP API остаются в gameplay process на :3000.
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    # Именно $http_host, а не $host.
    #
    # $host отбрасывает порт. Когда игра работает на нестандартном порту (например, 8443,
    # если 443 занят), браузер присылает Origin вида https://домен:8443, а сервер сверяет его
    # с заголовком Host. Без порта они не совпадут, и сервер откажется открывать WebSocket —
    # игра загрузится, но напарник не подключится, и причина будет совершенно неочевидна.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Кэширование на стороне прокси НЕ добавлять.
    #
    # Имена файлов клиента без хеша, а версия протокола у клиента и сервера обязана совпадать.
    # Закэшированный на прокси клиент после обновления будет говорить со свежим сервером
    # старыми сообщениями, и сбои начнут выглядеть случайными. Заголовки приложение выставляет
    # само: no-cache для клиента и shared/, длинный кэш только для /vendor.
    proxy_cache off;
}

location /ws {
    # Runtime-флаг создаёт только root-owned allowlisted helper. Проверка не требует reload:
    # maintenance начинает действовать для следующего WebSocket upgrade сразу. Уже открытые
    # соединения этим правилом не затрагиваются, поэтому текущий матч можно спокойно закончить.
    if (-f /run/wobble-ops/maintenance) {
        return 503;
    }

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Больше, чем период heartbeat сервера (15 с), иначе прокси будет рвать живые соединения
    # игроков, которые просто стоят на месте.
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;

    # Буферизация ответов ломает интерактивность сокета: пакеты должны уходить сразу.
    proxy_buffering off;
}

# Эти operational health endpoints нужны только локальным helper/control checks. Через Nginx их
# нельзя получить даже в shared-443/fallback-топологии, где адрес клиента может потеряться.
location ~* ^/health/ops$ {
    return 404;
}
location ~* ^/health/control$ {
    return 404;
}

# Проверки живости gameplay process — только изнутри: в /health видны метрики сервера.
location /health {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $http_host;
    allow 127.0.0.1;
    deny all;
}

# Игровая статистика — тоже только изнутри. Данные обезличены и ничьей тайной не являются, но
# сводка стоит запроса к базе, а открытый наружу адрес, который стоит запроса к базе, рано или
# поздно оказывается способом нагрузить сервер бесплатно.
#
# Смотреть с телефона: ssh -L 3000:127.0.0.1:3000 wobble@сервер, потом localhost:3000/metrics/gameplay.
location /metrics/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $http_host;
    allow 127.0.0.1;
    deny all;
}
