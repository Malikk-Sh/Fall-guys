name: PR95 focused regressions

on:
  push:
    branches:
      - agent/race-lobby-grid
    paths:
      - .github/workflows/pr95-focused.yml

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/race-lobby-grid
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check touched files
        run: |
          npx prettier --check shared/protocol.js shared/raceGrid.js client/net/networkBindings.js client/ui/menuBindings.js client/game/Character.js server/index.js server/roomBots.js server/raceSlots.js server/socketAuthProtocol.test.mjs server/roomBots.test.mjs server/raceGrid.test.mjs server/raceSlots.test.mjs server/raceBotGridRespawn.test.mjs server/raceLobbyGridSession.test.mjs package.json
          npx eslint shared/raceGrid.js client/net/networkBindings.js client/ui/menuBindings.js client/game/Character.js server/index.js server/roomBots.js server/raceSlots.js server/socketAuthProtocol.test.mjs server/raceSlots.test.mjs server/raceBotGridRespawn.test.mjs server/raceLobbyGridSession.test.mjs
      - name: Run focused protocol, bot and grid tests
        run: |
          node --test server/socketAuthProtocol.test.mjs server/roomBots.test.mjs server/raceGrid.test.mjs server/raceSlots.test.mjs server/raceBotGridRespawn.test.mjs server/raceLobbyGridSession.test.mjs
      - name: Remove temporary workflow
        run: rm .github/workflows/pr95-focused.yml
      - name: Commit helper removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove focused PR 95 workflow [skip ci]"
          git push origin HEAD:agent/race-lobby-grid
