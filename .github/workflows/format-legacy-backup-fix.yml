name: Temporary format legacy backup fix

on:
  push:
    branches: [fix/legacy-predeploy-backup]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write server/backup.js server/backup.test.mjs server/backupCli.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-legacy-backup-files
          path: |
            server/backup.js
            server/backup.test.mjs
            server/backupCli.mjs
