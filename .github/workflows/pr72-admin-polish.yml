name: Stage PR72 admin polish

on:
  push:
    branches:
      - feat/admin-mobile-polish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused admin UX polish
        run: python3 .github/pr72_patch.py

      - name: Format and validate admin files
        run: |
          npm ci --no-audit --no-fund
          npx prettier --write client/admin/admin.js client/admin/admin.css
          node --check client/admin/admin.js
          npx eslint client/admin/admin.js

      - name: Commit polished admin UI and remove staging helpers
        shell: bash
        run: |
          rm .github/workflows/pr72-admin-polish.yml .github/pr72_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/admin/admin.js client/admin/admin.css .github/workflows/pr72-admin-polish.yml .github/pr72_patch.py
          git commit -m "Polish Wobble Control mobile UX"
          git push origin HEAD:feat/admin-mobile-polish
