name: PR75 Support UI Polish

on:
  push:
    branches: [feat/player-support-center]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/player-support-center
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply support UI polish
        run: python3 tools/pr75_support_ui_polish.py

      - name: Format changed source
        run: npx prettier --write client/admin/admin.js

      - name: Lint source
        run: npm run check

      - name: Run full unit and integration suite
        run: npm test

      - name: Commit verified UI polish
        run: |
          set -euo pipefail
          git restore tools/pr75_support_ui_polish.py .github/workflows/pr75-support-ui-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No verified UI changes to commit.' >&2
            exit 1
          fi
          git commit -m 'Polish Player Support Center action feedback'
          git push origin HEAD:feat/player-support-center
