name: Finalize production safety

on:
  push:
    branches:
      - agent/production-safety

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-safety
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integrate production safety into existing deployment
        run: node tools/finalize-production-safety.cjs
      - name: Format JavaScript and documentation
        run: >-
          npx prettier --write
          tools/apply-production-safety.cjs
          tools/finalize-production-safety.cjs
          server/index.js
          server/backup.js
          server/backupStatus.js
          server/backupCli.mjs
          server/backup.test.mjs
          package.json
          deploy/PRODUCTION-SAFETY.md
      - name: Validate production shell scripts
        run: bash -n deploy/install.sh deploy/backup.sh deploy/restore.sh deploy/check-backup.sh deploy/smoke.sh
      - name: Check formatting and lint
        run: |
          npm run format:check
          npm run check
      - name: Run backup and migration regressions
        run: node --test server/backup.test.mjs server/migrations.test.mjs
      - name: Run full unit and integration suite
        run: npm test
      - name: Commit production files only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server deploy package.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Integrate verified production backup safety"
          git push origin HEAD:agent/production-safety
