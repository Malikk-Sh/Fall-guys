name: Temporary final social safety verification

on:
  push:
    branches:
      - agent/social-safety-replay
    paths:
      - .github/workflows/tmp-final-social-safety.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/social-safety-replay
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Close replay lifecycle edge cases
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('client/net/networkBindings.js')
          source = path.read_text()
          anchor = """  game.net.on('sessionExpired', () => {
              game.ui.error('Комната больше не существует. Возвращаемся в меню.');
          """
          replacement = """  game.net.on('sessionExpired', () => {
              game.pendingReplayShare = null;
              game.ui.error('Комната больше не существует. Возвращаемся в меню.');
          """
          if source.count(anchor) != 1:
              raise SystemExit('sessionExpired anchor mismatch')
          source = source.replace(anchor, replacement)

          anchor = """  game.net.on('disconnect', () => {
              game.showLinkState('failed');
          """
          replacement = """  game.net.on('disconnect', () => {
              game.pendingReplayShare = null;
              game.showLinkState('failed');
          """
          if source.count(anchor) != 1:
              raise SystemExit('disconnect anchor mismatch')
          source = source.replace(anchor, replacement)

          anchor = """  game.net.on('finishRejected', message => {
          """
          replacement = """  game.net.on('error', () => {
              // Pending replay intent exists only while CREATE_ROOM is awaiting an authoritative
              // lobby. Any server error means that request did not produce the room we intended.
              game.pendingReplayShare = null;
            });

            game.net.on('finishRejected', message => {
          """
          if source.count(anchor) != 1:
              raise SystemExit('error listener anchor mismatch')
          path.write_text(source.replace(anchor, replacement))
          PY
      - name: Format final files
        run: npx prettier --write client/net/networkBindings.js server/socialSafety.js server/socialSafety.test.mjs server/accounts.js
      - name: Lint final files
        run: npx eslint client/net/networkBindings.js server/socialSafety.js server/socialSafety.test.mjs server/accounts.js
      - name: Run full test suite
        run: npm test
      - name: Commit permanent fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/net/networkBindings.js server/socialSafety.js server/socialSafety.test.mjs server/accounts.js
          git diff --cached --quiet && exit 0
          git commit -m 'Harden social safety and replay lifecycle edges'
          git push origin HEAD:agent/social-safety-replay
