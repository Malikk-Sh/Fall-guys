# Shared external TLS frontend.
# ssl_preread reads only ClientHello metadata (SNI); TLS itself remains end-to-end with the
# selected backend. This lets Wobble and Xray/REALITY share public TCP/443 safely.
stream {
    map $ssl_preread_server_name $wobble_shared_tls_backend {
        server_name_placeholder  127.0.0.1:8443;
        default                  fallback_placeholder;
    }

    server {
        listen 443;
        listen [::]:443;

        ssl_preread on;
        proxy_pass $wobble_shared_tls_backend;
        proxy_connect_timeout 5s;
        proxy_timeout 24h;
    }
}
