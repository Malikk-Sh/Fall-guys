name: PR74 Address Reviews

on:
  push:
    branches: [feat/maintenance-operations]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/maintenance-operations
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply reviewed fixes
        shell: bash
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d >/tmp/pr74_patch.py
          python3 /tmp/pr74_patch.py

      - name: Format focused changes
        run: npx prettier --write server/index.js deploy/wobble-ops-helper.mjs server/adminOperations.test.mjs

      - name: Run focused operation tests
        run: node --test server/adminOperations.test.mjs

      - name: Lint focused changes
        run: npx eslint server/index.js deploy/wobble-ops-helper.mjs server/adminOperations.test.mjs

      - name: Run full unit and integration suite
        run: npm test

      - name: Commit reviewed fixes and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr74-address-reviews.yml
          git add server/index.js deploy/wobble-ops-helper.mjs server/adminOperations.test.mjs
          git diff --cached --check
          git config user.name "Malik"
          git config user.email "93332098+Malikk-Sh@users.noreply.github.com"
          git commit -m "Close PR74 review race windows"
          git push origin HEAD:feat/maintenance-operations
