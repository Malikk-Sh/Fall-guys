name: Fix social UI selector

on:
  push:
    branches:
      - agent/social-cosmetics

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/social-cosmetics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Repair query-all helper
        run: node tools/fix-social-select-all.cjs
      - name: Format and lint repaired UI
        run: |
          npx prettier --write client/ui/UI.js
          npx eslint client/ui/UI.js
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- client/ui/UI.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/ui/UI.js
          git commit -m "Use explicit query-all helper in social UI"
          git push origin HEAD:agent/social-cosmetics
