name: Verify Wobble Rush

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wobble-rush-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Fast quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run preflight checks
        run: npm run preflight

  tests:
    name: Node tests (${{ matrix.suite }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        suite: [server, client]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run ${{ matrix.suite }} tests
        run: npm run test:${{ matrix.suite }}

  production:
    name: Production smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify shared-443 Nginx configuration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx libnginx-mod-stream
          bash deploy/verify-shared443-config.sh

      - name: Run production backup and deploy smoke
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          server_log="$tmp_dir/server.log"
          export LEADERBOARD_DB="$tmp_dir/game.db"
          export BACKUP_DIR="$tmp_dir/backups"
          export BACKUP_STATUS_FILE="$tmp_dir/backups/status.json"
          export PORT=3100
          export HOST=127.0.0.1
          export ALLOWED_ORIGINS=http://127.0.0.1:3100
          node server/bootstrap.js >"$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true
            rm -rf "$tmp_dir"
          }
          trap cleanup EXIT

          ready=0
          for _ in {1..50}; do
            if curl -fsS --max-time 1 http://127.0.0.1:3100/health/live >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$server_log"
            exit 1
          fi

          node server/backupCli.mjs create
          if ! SMOKE_URL=http://127.0.0.1:3100 \
            SMOKE_ORIGIN=http://127.0.0.1:3100 \
            bash deploy/smoke.sh --require-backup; then
            cat "$server_log"
            exit 1
          fi

  e2e:
    name: E2E (${{ matrix.name }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop
            command: npm run test:e2e:desktop
            exclude_full_match: '1'
            retries: '0'
            timeout_minutes: 12
          - name: mobile
            command: npm run test:e2e:mobile
            exclude_full_match: '0'
            retries: '0'
            timeout_minutes: 12
          - name: fullscreen
            command: npm run test:e2e:fullscreen
            exclude_full_match: '0'
            retries: '0'
            timeout_minutes: 12
          - name: full-match
            command: npm run test:e2e:full-match
            exclude_full_match: '0'
            retries: '1'
            timeout_minutes: 20
    env:
      WOBBLE_E2E_EXCLUDE_FULL_MATCH: ${{ matrix.exclude_full_match }}
      WOBBLE_E2E_RETRIES: ${{ matrix.retries }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.name }} browser tests
        run: ${{ matrix.command }}

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.name }}
          path: playwright-report/
          retention-days: 7

  verify:
    name: CI ready
    if: always()
    needs: [quality, tests, production, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Summarize required jobs
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          PRODUCTION: ${{ needs.production.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          {
            echo "### Wobble Rush CI"
            echo
            echo "| Group | Result |"
            echo "| --- | --- |"
            echo "| Fast quality gate | $QUALITY |"
            echo "| Node tests | $TESTS |"
            echo "| Production smoke | $PRODUCTION |"
            echo "| Browser E2E | $E2E |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for result in "$QUALITY" "$TESTS" "$PRODUCTION" "$E2E"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
