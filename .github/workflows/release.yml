name: Publish Wobble Rush Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: wobble-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Require release commit to come from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit contained in main." >&2
            exit 1
          }

      - name: Validate release tag and project version
        run: node deploy/check-release.mjs "$GITHUB_REF_NAME"

      - name: Check formatting
        run: npm run format:check

      - name: Lint source
        run: npm run check

      - name: Run gameplay and multiplayer tests
        run: npm test

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run two-browser multiplayer smoke test
        run: npm run test:e2e

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(
            --verify-tag
            --title "Wobble Rush ${GITHUB_REF_NAME}"
            --generate-notes
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
