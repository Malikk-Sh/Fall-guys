name: Apply staged recovery protocol

on:
  push:
    branches: [agent/account-self-service]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/account-self-service
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staged recovery changes
        run: python3 .github/scripts/stage-account-recovery.py
      - name: Format touched files
        run: npx prettier --write server/migrations/010_recovery_rotation.js server/migrations/index.js server/migrations.test.mjs server/accountSelfService.js server/accountSelfService.test.mjs server/accountSelfService.client.test.mjs server/authRoutes.js client/core/account.js client/core/AccountFlow.js docs/ACCOUNT-SELF-SERVICE.md
      - name: Run focused regression tests
        run: node --test server/accountSelfService.test.mjs server/migrations.test.mjs && node --experimental-loader ./server/client-loader.mjs --test server/accountSelfService.client.test.mjs server/account.client.test.mjs
      - name: Commit changes and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-staged-recovery.yml .github/scripts/stage-account-recovery.py
          git add server/migrations/010_recovery_rotation.js server/migrations/index.js server/migrations.test.mjs server/accountSelfService.js server/accountSelfService.test.mjs server/accountSelfService.client.test.mjs server/authRoutes.js client/core/account.js client/core/AccountFlow.js docs/ACCOUNT-SELF-SERVICE.md
          git commit -m "Make recovery rotation staged and retry-safe"
          git push origin HEAD:agent/account-self-service
