name: Temporary integrate player support workspace

on:
  push:
    branches: [feat/admin-player-support]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-player-support
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply integration changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Fix prepared-statement argument order/count in the new support model.
          p = Path('server/adminPlayerSupport.js')
          s = p.read_text()
          s = s.replace(
            "this.statements.search.all(normalized, prefix, like, normalized, normalized, now, safeLimit)",
            "this.statements.search.all(now, normalized, prefix, like, normalized, normalized, safeLimit)"
          )
          s = s.replace(
            "const session = this.statements.sessions.get(now, now, now, id);",
            "const session = this.statements.sessions.get(now, now, now, now, id);"
          )
          p.write_text(s)

          # Capabilities: account-level support is owner/operator only.
          p = Path('server/adminAuth.js')
          s = p.read_text()
          s = s.replace(
            "    'analytics.read',\n    'moderation.read',",
            "    'analytics.read',\n    'player-support.read',\n    'moderation.read',",
            1
          )
          s = s.replace(
            "operator: Object.freeze(['dashboard.read', 'analytics.read', 'moderation.read', 'audit.read']),",
            "operator: Object.freeze([\n    'dashboard.read',\n    'analytics.read',\n    'player-support.read',\n    'moderation.read',\n    'audit.read'\n  ]),"
          )
          p.write_text(s)

          # Routes.
          p = Path('server/adminRoutes.js')
          s = p.read_text()
          anchor = """  app.post('/api/admin/moderation/queue', json, (req, res) => {"""
          block = """  app.post('/api/admin/players/search', json, (req, res) => {
            const resolved = requireAdmin(req, res, 'player-support.read');
            if (!resolved) return undefined;
            if (!keysOnly(req.body, new Set(['query', 'limit']))) {
              return res.status(400).json({ ok: false, error: 'invalid-payload' });
            }
            const result = control.playerSearch(req.body?.query, { limit: req.body?.limit });
            if (!result.ok) {
              return res.status(400).json({
                ok: false,
                error: result.reason,
                ...(result.minLength ? { minLength: result.minLength } : {}),
                ...(result.maxLength ? { maxLength: result.maxLength } : {})
              });
            }
            return res.json(result);
          });

          app.post('/api/admin/players/detail', json, (req, res) => {
            const resolved = requireAdmin(req, res, 'player-support.read');
            if (!resolved) return undefined;
            if (!keysOnly(req.body, new Set(['accountId'])) || !req.body?.accountId) {
              return res.status(400).json({ ok: false, error: 'invalid-payload' });
            }
            const result = control.playerDetail(req.body.accountId, { actor: resolved.session.user });
            if (!result.ok) {
              const status = result.reason === 'unknown-account' ? 404 : 400;
              return res.status(status).json({ ok: false, error: result.reason });
            }
            return res.json(result);
          });

          """ + anchor
          if anchor not in s:
            raise SystemExit('admin routes anchor missing')
          p.write_text(s.replace(anchor, block, 1))

          # Test command.
          p = Path('package.json')
          s = p.read_text()
          s = s.replace(
            "server/adminAnalytics.test.mjs server/googleIdentity.test.mjs",
            "server/adminAnalytics.test.mjs server/adminPlayerSupport.test.mjs server/adminPlayerSupportRoutes.test.mjs server/googleIdentity.test.mjs"
          )
          p.write_text(s)
          PY
      - name: Format backend files
        run: npx prettier --write server/adminPlayerSupport.js server/adminAuth.js server/adminRoutes.js server/adminControl.js server/adminPlayerSupport.test.mjs package.json
      - name: Commit backend integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/adminPlayerSupport.js server/adminAuth.js server/adminRoutes.js server/adminControl.js server/adminPlayerSupport.test.mjs package.json
          git commit -m 'Integrate privacy-safe player support backend'
          git push origin HEAD:feat/admin-player-support
