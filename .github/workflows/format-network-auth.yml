name: Format network auth files

on:
  push:
    branches:
      - agent/network-auth-hardening

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/network-auth-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run exact Prettier
        run: npx prettier --write client/net/NetworkManager.js shared/protocol.js
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- client/net/NetworkManager.js shared/protocol.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/net/NetworkManager.js shared/protocol.js
          git commit -m "Format network auth hardening"
          git push origin HEAD:agent/network-auth-hardening
