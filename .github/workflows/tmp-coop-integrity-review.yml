name: Temporary co-op integrity final review

# Temporary rerun after directed-progress regression was corrected.
on:
  push:
    branches:
      - agent/coop-integrity
    paths:
      - .github/workflows/tmp-coop-integrity-review.yml

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/coop-integrity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply final audit review fix
        run: node tools/fix-coop-integrity-review.cjs
      - name: Format reviewed files
        run: npx prettier --write server/coopMovementAudit.js server/coopMovementAudit.test.mjs
      - name: Lint reviewed files
        run: npx eslint server/coopMovementAudit.js server/coopMovementAudit.test.mjs
      - name: Run co-op audit tests
        run: node --test server/coopMovementAudit.test.mjs
      - name: Run full test suite
        run: npm test
      - name: Commit reviewed integrity fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/coopMovementAudit.js server/coopMovementAudit.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Harden co-op audit against sparse packets and tether abuse'
          git push origin HEAD:agent/coop-integrity
