name: Temporary fix analytics test isolation

on:
  push:
    branches: [feat/admin-analytics-usability]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/admin-analytics-usability
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Isolate disconnect abandonment regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/integration.test.js')
          text = path.read_text()
          old = """test('не вернувшийся после grace period игрок учитывается как abandonment', async t => {
            await listen();
            const url = `ws://127.0.0.1:${server.address().port}/ws`;
            const { host, guest, started } = await startedRoom(url, 'coop');"""
          new = """test('не вернувшийся после grace period игрок учитывается как abandonment', async t => {
            await listen();
            // Integration tests share the in-process room registry. Expire disconnected players left by
            // earlier scenarios before taking this test's metric baseline, otherwise the deliberate
            // future timestamp below would correctly sweep them too and make the delta non-local.
            expireDisconnectedPlayers(Date.now() + 30_001);
            const url = `ws://127.0.0.1:${server.address().port}/ws`;
            const { host, guest, started } = await startedRoom(url, 'coop');"""
          if old not in text:
              raise SystemExit('target test anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format test
        run: npx prettier --write server/integration.test.js

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/integration.test.js
          git commit -m 'Isolate disconnect abandonment regression'
          git push origin HEAD:feat/admin-analytics-usability
