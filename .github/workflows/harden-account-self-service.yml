name: Harden account self-service

on:
  push:
    branches: [agent/account-self-service]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/account-self-service
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply focused fixes
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('client/core/AccountFlow.js'); t=p.read_text(); old='if (this.security?.revokeOthers?.isConnected) this.security.revokeOthers.disabled = false;'; new=\"if (this.security?.revokeOthers?.isConnected)\\n        this.security.revokeOthers.disabled =\\n          !this.online || !this.security.sessions.querySelector('button');\"; assert old in t; p.write_text(t.replace(old,new,1))"
          python3 -c "from pathlib import Path; p=Path('server/auth.js'); t=p.read_text(); old='revokeOtherSessions(accountId, currentToken) {'; new='revokeOtherSessions(accountId, currentToken, now = Date.now()) {'; assert old in t; t=t.replace(old,new,1); old='    if (!id || !currentHash) return 0;\\n    return this.statements.deleteOtherSessions.run(id, currentHash).changes;'; new='    if (!id || !currentHash) return 0;\\n    const current = this.statements.session.get(currentHash);\\n    if (!current || current.account_id !== id || current.expires_at <= now) return 0;\\n    return this.statements.deleteOtherSessions.run(id, currentHash).changes;'; assert old in t; p.write_text(t.replace(old,new,1))"
          python3 -c "from pathlib import Path; p=Path('server/accountSelfService.js'); t=p.read_text(); old='this.auth.revokeOtherSessions(id, currentToken)'; new='this.auth.revokeOtherSessions(id, currentToken, at)'; assert old in t; p.write_text(t.replace(old,new,1))"
          npx prettier --write client/core/AccountFlow.js server/auth.js server/accountSelfService.js
      - name: Commit fixes and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/harden-account-self-service.yml
          git add client/core/AccountFlow.js server/auth.js server/accountSelfService.js
          git commit -m "Harden account self-service edge cases"
          git push origin HEAD:agent/account-self-service
