name: Update PR56 from main

on:
  push:
    branches:
      - agent/social-safety-replay

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/social-safety-replay
          fetch-depth: 0

      - name: Merge current main and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-ff origin/main -m 'Merge current main into social safety branch'
          rm -f .github/workflows/update-pr56-from-main.yml
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:agent/social-safety-replay
