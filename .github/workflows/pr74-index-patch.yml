name: PR74 centralized drain patch

on:
  push:
    branches: [feat/maintenance-operations]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/maintenance-operations
          fetch-depth: 0

      - name: Add shared drain state and guard every countdown transition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/index.js')
          text = path.read_text()

          import_old = "const { SocialSafety } = require('./socialSafety');\n"
          import_new = import_old + "const operationalState = require('./operationalState');\n"
          if text.count(import_old) != 1 or "require('./operationalState')" in text:
              raise SystemExit('unexpected operationalState import anchor')
          text = text.replace(import_old, import_new, 1)

          countdown_old = "function beginCountdown(room) {\n  if (!setRoomState(room, ROOM_STATE.COUNTDOWN)) return;\n"
          countdown_new = """function beginCountdown(room) {
            // Drain is a process-wide admission boundary, not just an Nginx connection gate. Existing
            // lobby/results sockets stay alive while current matches finish, but none of them may start
            // another countdown after SIGUSR2. Every path (host start, matchmaking, rematch, next chapter)
            // funnels through this one function.
            if (operationalState.isDraining()) {
              broadcast(room, { type: S2C.SERVER_SHUTDOWN, reason: 'restart' });
              return false;
            }
            if (!setRoomState(room, ROOM_STATE.COUNTDOWN)) return false;
          """
          # Strip the indentation introduced by the Python source itself.
          countdown_new = '\n'.join(line[10:] if line.startswith('          ') else line for line in countdown_new.splitlines()) + '\n'
          if text.count(countdown_old) != 1:
              raise SystemExit('unexpected beginCountdown anchor')
          text = text.replace(countdown_old, countdown_new, 1)

          path.write_text(text)

          state_path = Path('server/operationalState.js')
          if state_path.exists():
              raise SystemExit('operationalState.js already exists unexpectedly')
          state_path.write_text("""'use strict';

          // Process-wide operational admission state shared by bootstrap and the game protocol.
          // Once drain starts it is intentionally irreversible: this process is on its way out and
          // systemd will replace it with a fresh process whose module state starts clean.
          let draining = false;

          function beginDrain() {
            if (draining) return false;
            draining = true;
            return true;
          }

          function isDraining() {
            return draining;
          }

          module.exports = { beginDrain, isDraining };
          """.replace('          ', ''))
          PY

          npx prettier --write server/index.js server/operationalState.js
          git diff --check
          grep -n "operationalState.isDraining" server/index.js
          grep -n "function beginDrain" server/operationalState.js

      - name: Commit guarded change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js server/operationalState.js
          if git diff --cached --quiet; then
            echo "No patch to commit"
            exit 0
          fi
          git commit -m "Block new matches once graceful drain begins"
          git push origin HEAD:feat/maintenance-operations
