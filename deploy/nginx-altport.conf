# Nginx для случая, когда порт 443 уже занят другим сервисом.
#
# Типичный пример: на том же VPS работает VPN (Xray/Reality на 443), и отдавать ему 443 нельзя —
# именно на этом порту он и выглядит обычным HTTPS. Тогда игра получает TLS на другом порту,
# а ссылка выходит вида `https://домен:8443`.
#
# Порт 80 всё равно нужен: проверка Let's Encrypt (HTTP-01) ходит только на 80 и 443, другого
# способа выпустить сертификат по домену нет. Поэтому 80 остаётся за Nginx и отдаёт только
# проверочные файлы, а всё остальное уводит на TLS-порт.
#
# Скрипт установки подставляет сюда домен и порт сам. Файл — эталон того, что получится.
#
# Одно расхождение с эталоном возможно: отдельная директива `http2 on;` появилась в nginx 1.25.1,
# а в Ubuntu 24.04 ставится 1.24. Скрипт проверяет конфиг через `nginx -t` и, если директиву не
# приняли, записывает её прежней формой — параметром `http2` у `listen`.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Проверка Let's Encrypt. Certbot кладёт сюда файл, читает его снаружи по http и на этом
    # основании выпускает сертификат.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное — на защищённый порт. Игроку, открывшему http://домен, не нужно знать
    # про номер порта: его перебросит сюда автоматически.
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/wobble-locations.conf;

    gzip on;
    # text/html здесь не указан намеренно: он сжимается всегда и переопределению не подлежит,
    # а повторное упоминание даёт warning при каждой перезагрузке Nginx.
    gzip_types application/javascript text/css application/json;
    gzip_min_length 1024;

    client_max_body_size 64k;
}
