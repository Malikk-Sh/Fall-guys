name: PR81 Alert Center hardening gate

on:
  push:
    branches:
      - feat/operator-alert-center

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operator-alert-center
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Alert Center hardening
        run: python scripts/pr81-alert-hardening.py
      - name: Format and lint
        run: |
          npx prettier --write \
            server/controlPlaneAlerts.js \
            server/controlPlaneAlerts.test.mjs \
            client/admin/alerts.js \
            docs/ALERT-CENTER.md
          npm run format:check
          npm run check
          git diff --check
      - name: Focused Alert Center regressions
        run: |
          node --test \
            server/controlPlaneAlerts.test.mjs \
            server/controlPlaneRoutes.test.mjs \
            server/controlPlaneDeploy.test.mjs \
            server/durableOperations.test.mjs
      - name: Verify hardening contracts
        run: |
          grep -Fq "'monitoring-degraded'" server/controlPlaneAlerts.js
          grep -Fq "'operations-unavailable'" server/controlPlaneAlerts.js
          grep -Fq "current.acknowledgedAt = null" server/controlPlaneAlerts.js
          grep -Fq "this.alerts = before" server/controlPlaneAlerts.js
          grep -Fq "storageError" client/admin/alerts.js
      - name: Persist checked hardening and remove temporary gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            server/controlPlaneAlerts.js \
            server/controlPlaneAlerts.test.mjs \
            client/admin/alerts.js \
            docs/ALERT-CENTER.md
          git rm .github/workflows/pr81-alert-hardening-gate.yml scripts/pr81-alert-hardening.py
          git commit -m 'Harden Alert Center escalation and state durability'
          git push origin HEAD:feat/operator-alert-center
