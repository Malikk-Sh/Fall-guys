<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#4b35b7" />
    <title>Wobble Rush · Нет сети</title>
    <style>
      :root {
        font-family: Inter, system-ui, sans-serif;
        color: #fff;
        background: #31218b;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 20%, #7659e8, #31218b 62%, #1d1656);
      }
      main {
        width: min(440px, 100%);
        padding: 32px;
        border: 1px solid #ffffff2e;
        border-radius: 28px;
        background: #16113db8;
        box-shadow: 0 24px 80px #09061f80;
        text-align: center;
      }
      i {
        display: grid;
        place-items: center;
        width: 82px;
        height: 82px;
        margin: 0 auto 20px;
        border-radius: 28px;
        background: #ff4f91;
        font-size: 42px;
        font-style: normal;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 8vw, 44px);
      }
      p {
        margin: 0 0 24px;
        color: #d9d6ff;
        line-height: 1.55;
      }
      a {
        display: block;
        padding: 16px 20px;
        border-radius: 18px;
        background: #fff;
        color: #382794;
        text-decoration: none;
        font-weight: 900;
        letter-spacing: 0.04em;
      }
      small {
        display: block;
        margin-top: 18px;
        color: #aaa4da;
      }
    </style>
  </head>
  <body>
    <main>
      <i aria-hidden="true">☁</i>
      <h1>НЕТ СОЕДИНЕНИЯ</h1>
      <p>
        Wobble Rush уже установлен на устройстве, но для входа в аккаунт и сетевой игры сейчас нужен интернет.
      </p>
      <a href="/">ПОВТОРИТЬ ПОДКЛЮЧЕНИЕ</a>
      <small>Если сеть вернулась, откройте игру снова.</small>
    </main>
  </body>
</html>
