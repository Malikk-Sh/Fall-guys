name: Temporary lint helper

on:
  push:
    branches:
      - agent/race-server-auto-finish

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: agent/race-server-auto-finish
      - name: Remove unnecessary template escapes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/shadowInputPreload.js')
          text = path.read_text()
          path.write_text(text.replace('\\"', '"'))
          PY
      - name: Commit lint fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/shadowInputPreload.js
          git commit -m "Remove unnecessary template escapes"
          git push origin HEAD:agent/race-server-auto-finish
