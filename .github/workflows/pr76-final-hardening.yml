name: PR76 Final Hardening

on:
  push:
    branches: [feat/live-incident-diagnostics]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/live-incident-diagnostics
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply final hardening fixes
        run: python3 tools/pr76_final_hardening.py

      - name: Format changed source
        run: |
          npx prettier --write \
            server/incidentDiagnostics.js \
            server/incidentDiagnostics.test.mjs \
            server/index.js \
            server/socketAuthIntegration.test.mjs \
            server/backup.js \
            server/backup.test.mjs \
            docs/DEPLOY.md

      - name: Verify migration docs use scrubbed snapshot pipeline
        run: |
          ! grep -F 'cp /var/lib/wobble/leaderboard.db /var/lib/wobble/leaderboard.db.bak' docs/DEPLOY.md
          grep -F 'server/backupCli.mjs snapshot' docs/DEPLOY.md

      - name: Run focused final regressions
        run: |
          node --test \
            server/incidentDiagnostics.test.mjs \
            server/backup.test.mjs \
            server/socketAuthIntegration.test.mjs \
            server/networkSanctions.test.mjs \
            server/adminIncidentRoutes.test.mjs \
            server/adminOperations.test.mjs

      - name: Lint source
        run: npm run check

      - name: Run full unit and integration suite
        run: npm test

      - name: Commit verified final hardening
        run: |
          set -euo pipefail
          git restore tools/pr76_final_hardening.py .github/workflows/pr76-final-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No verified hardening changes to commit.' >&2
            exit 1
          fi
          git commit -m 'Harden Incident Center retention and backups'
          git push origin HEAD:feat/live-incident-diagnostics
