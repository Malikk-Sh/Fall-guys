name: Verify Wobble Rush

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wobble-rush-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Сквозной тест полного матча идёт настоящее время: забег нельзя ускорить, сервер проверяет
    # скорость так же, как у живого игрока. Два таких сценария — около двух минут сверх прежнего.
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # 22, а не 20: в проекте используется встроенный node:sqlite, он появился в 22.5.
      # Подпись шага раньше говорила «Node.js 20», хотя ставилась 22, — расходилась с делом.
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      # Форматирование запускается до долгих интеграционных и браузерных сценариев. Помимо стиля,
      # это быстро ловит следы неразрешённого merge и случайно вставленный в исходник обычный текст.
      - name: Check formatting and merge artifacts
        run: |
          npm run format:check
          ! rg -n '^(<<<<<<<|=======|>>>>>>>)' --glob '!node_modules/**' .

      - name: Run gameplay and multiplayer tests
        run: npm test

      - name: Check production entry points
        run: npm run check

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run two-browser multiplayer smoke test
        run: npm run test:e2e

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
