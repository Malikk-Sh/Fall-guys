name: Apply exact release deploy patch

on:
  push:
    branches: [agent/exact-release-deploy]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-release-deploy
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Patch release-pinned deployment
        run: |
          sed -i 's|old = "server/releaseProcess.test.mjs server/observability.test.mjs"|old = "server/coopMovementAudit.test.mjs server/releaseProcess.test.mjs"|' .github/exact-release-patch.py
          sed -i 's|"server/releaseProcess.test.mjs server/releaseDeploy.test.mjs server/observability.test.mjs"|"server/coopMovementAudit.test.mjs server/releaseProcess.test.mjs server/releaseDeploy.test.mjs"|' .github/exact-release-patch.py
          python3 .github/exact-release-patch.py
          npx prettier --write package.json server/buildInfo.js server/index.js server/releaseDeploy.test.mjs docs/RELEASE-PROCESS.md

      - name: Focused verification
        run: |
          bash -n deploy/install.sh deploy/smoke.sh
          node --test server/releaseProcess.test.mjs server/releaseDeploy.test.mjs server/observability.test.mjs
          npm run check

      - name: Commit patch and remove one-shot helpers
        shell: bash
        run: |
          rm .github/workflows/apply-exact-release-deploy.yml .github/exact-release-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/install.sh deploy/smoke.sh server/buildInfo.js server/index.js server/releaseDeploy.test.mjs package.json docs/RELEASE-PROCESS.md .github/workflows/apply-exact-release-deploy.yml .github/exact-release-patch.py
          git commit -m "Pin production deploys to exact release tags"
          git push origin HEAD:agent/exact-release-deploy
