name: PR74 Address Reviews V2

on:
  push:
    branches: [feat/maintenance-operations]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/maintenance-operations
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Reuse reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          patch_b64="$(sed -n 's/^          PATCH_B64: //p' .github/workflows/pr74-address-reviews.yml)"
          test -n "$patch_b64"
          printf '%s' "$patch_b64" | base64 -d >/tmp/pr74_patch.py
          python3 /tmp/pr74_patch.py

      - name: Update refactored signal-order assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/adminOperations.test.mjs')
          lines = path.read_text().splitlines()
          needle = '  const signalAt = helper.indexOf("[\'kill\', \'--kill-whom=main\', \'--signal=SIGUSR2\', \'wobble.service\']");'
          matches = [i for i, line in enumerate(lines) if line == needle]
          if len(matches) != 1:
              raise SystemExit(f'expected one old signal-order line, got {len(matches)}')
          i = matches[0]
          lines[i:i + 1] = [
              "  const startRestartAt = helper.indexOf('async function startGracefulRestart');",
              "  const signalAt = helper.indexOf('const signal = await sendGracefulRestartSignal();', startRestartAt);"
          ]
          path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Format focused changes
        run: npx prettier --write server/index.js deploy/wobble-ops-helper.mjs server/adminOperations.test.mjs

      - name: Run focused operation tests
        run: node --test server/adminOperations.test.mjs

      - name: Lint focused changes
        run: npx eslint server/index.js deploy/wobble-ops-helper.mjs server/adminOperations.test.mjs

      - name: Run full unit and integration suite
        run: npm test

      - name: Commit reviewed fixes and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr74-address-reviews.yml .github/workflows/pr74-address-reviews-v2.yml
          git add server/index.js deploy/wobble-ops-helper.mjs server/adminOperations.test.mjs
          git diff --cached --check
          git config user.name "Malik"
          git config user.email "93332098+Malikk-Sh@users.noreply.github.com"
          git commit -m "Close PR74 review race windows"
          git push origin HEAD:feat/maintenance-operations
