name: PR79 Codex review gate

on:
  push:
    branches:
      - fix/pr79-codex-review

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr79-codex-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Codex review batch
        run: python scripts/pr79-codex-review.py
      - name: Format and lint
        run: |
          npx prettier --write \
            deploy/wobble-ops-helper.mjs \
            server/adminOperationsClient.js \
            server/controlPlaneRoutes.js \
            server/durableOperations.test.mjs \
            server/controlPlaneRoutes.test.mjs \
            client/admin/admin.js
          npm run format:check
          npm run check
          git diff --check
          bash -n deploy/install.sh
      - name: Focused durable operations regressions
        run: |
          node --test \
            server/durableOperations.test.mjs \
            server/adminOperations.test.mjs \
            server/controlPlaneRoutes.test.mjs
      - name: Verify review contracts
        run: |
          grep -Fq "WantedBy=multi-user.target" deploy/wobble-ops.service
          grep -Eq "systemctl enable.*wobble-ops\.service" deploy/install.sh
          grep -Fq "const now = Math.max(current.createdAt, current.updatedAt, requestedNow);" deploy/wobble-ops-helper.mjs
          grep -Fq "ensureRestartOperation(marker" deploy/wobble-ops-helper.mjs
          grep -Fq "finalizeRestartOperation({" deploy/wobble-ops-helper.mjs
          grep -Fq "activeOperationId: operationId" server/controlPlaneRoutes.js
          grep -Fq "item.durationMs != null" server/adminOperationsClient.js
          grep -Fq "entry.durationMs != null" client/admin/admin.js
      - name: Persist checked review fixes and remove temporary gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            deploy/wobble-ops-helper.mjs \
            deploy/wobble-ops.service \
            deploy/install.sh \
            server/adminOperationsClient.js \
            server/controlPlaneRoutes.js \
            server/durableOperations.test.mjs \
            server/controlPlaneRoutes.test.mjs \
            client/admin/admin.js
          git rm .github/workflows/pr79-codex-review-gate.yml scripts/pr79-codex-review.py
          git commit -m 'Address PR79 Codex durability review'
          git push origin HEAD:fix/pr79-codex-review
