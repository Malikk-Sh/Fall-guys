name: Patch shared443 WebSocket lookup

on:
  push:
    branches:
      - fix/shared443-ws-lookup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shared443-ws-lookup
          fetch-depth: 0

      - name: Apply Node 22 lookup compatibility fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('deploy/install.sh')
          text = path.read_text()
          old = """const WebSocket = require('ws');
          const domain = process.argv[2];
          const socket = new WebSocket(`wss://${domain}/ws`, {
            headers: { Origin: `https://${domain}` },
            servername: domain,
            lookup(_hostname, _options, callback) {
              callback(null, '127.0.0.1', 4);
            },
          });"""
          new = """const WebSocket = require('ws');
          const loopbackLookup = require('./deploy/loopbackLookup.cjs');
          const domain = process.argv[2];
          const socket = new WebSocket(`wss://${domain}/ws`, {
            headers: { Origin: `https://${domain}` },
            servername: domain,
            lookup: loopbackLookup,
          });"""
          if old not in text:
              raise SystemExit('expected shared-443 WebSocket lookup block not found')
          path.write_text(text.replace(old, new, 1))
          PY

          cat > deploy/loopbackLookup.cjs <<'EOF'
          'use strict';

          function loopbackLookup(_hostname, options, callback) {
            if (options?.all) {
              callback(null, [{ address: '127.0.0.1', family: 4 }]);
              return;
            }

            callback(null, '127.0.0.1', 4);
          }

          module.exports = loopbackLookup;
          EOF

          cat > deploy/verify-loopback-lookup.cjs <<'EOF'
          'use strict';

          const assert = require('node:assert/strict');
          const loopbackLookup = require('./loopbackLookup.cjs');

          let singleChecked = false;
          loopbackLookup('wobbles.ru', {}, (error, address, family) => {
            assert.equal(error, null);
            assert.equal(address, '127.0.0.1');
            assert.equal(family, 4);
            singleChecked = true;
          });
          assert.equal(singleChecked, true);

          let allChecked = false;
          loopbackLookup('wobbles.ru', { all: true }, (error, addresses) => {
            assert.equal(error, null);
            assert.deepEqual(addresses, [{ address: '127.0.0.1', family: 4 }]);
            allChecked = true;
          });
          assert.equal(allChecked, true);

          console.log('shared-443 loopback lookup: ok');
          EOF

          if ! grep -q 'verify-loopback-lookup.cjs' deploy/verify-shared443-config.sh; then
            cat >> deploy/verify-shared443-config.sh <<'EOF'

          # Node 22 may call custom lookup functions with options.all=true during
          # network-family autoselection. Keep the production WebSocket smoke compatible.
          node deploy/verify-loopback-lookup.cjs
          EOF
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/install.sh deploy/loopbackLookup.cjs deploy/verify-loopback-lookup.cjs deploy/verify-shared443-config.sh
          git commit -m 'Fix Node 22 shared-443 WebSocket lookup'
          git push origin HEAD:fix/shared443-ws-lookup
