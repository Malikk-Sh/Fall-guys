name: Weekly Multiplayer Soak

on:
  schedule:
    - cron: '47 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wobble-rush-weekly-soak
  cancel-in-progress: false

jobs:
  soak:
    name: 30-minute multiplayer soak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WOBBLE_SOAK_PHASE_SECONDS: '300'
      WOBBLE_SOAK_SAMPLE_MS: '20000'
      WOBBLE_SOAK_CHURN_PULSE_MS: '60000'
      WOBBLE_SOAK_CHURN_ROOMS: '10'
      WOBBLE_SOAK_CHURN_STORM_CLIENTS: '20'
      WOBBLE_SOAK_CHURN_ROOM_ITERATIONS: '20'
      WOBBLE_SOAK_BASELINE_EVENT_LOOP_P95_MS: '20.9'
      WOBBLE_SOAK_WARN_EVENT_LOOP_P95_MS: '45'
      WOBBLE_SOAK_MAX_EVENT_LOOP_P95_MS: '60'
      WOBBLE_SOAK_BASELINE_RSS_MB: '108'
      WOBBLE_SOAK_MAX_RSS_MB: '180'
      WOBBLE_SOAK_WARN_RECOVERY_RSS_GROWTH_MB: '32'
      WOBBLE_SOAK_MAX_RECOVERY_RSS_GROWTH_MB: '64'
      WOBBLE_SOAK_WARN_RECOVERY_HEAP_GROWTH_MB: '24'
      WOBBLE_SOAK_MAX_RECOVERY_HEAP_GROWTH_MB: '48'
      WOBBLE_SOAK_MIN_DURATION_SECONDS: '1800'
      WOBBLE_SOAK_PROBE_RESULT_PATH: ${{ runner.temp }}/wobble-soak-probe.json
      WOBBLE_SOAK_RESULT_PATH: ${{ runner.temp }}/wobble-soak-result.json
      WOBBLE_SOAK_CSV_PATH: ${{ runner.temp }}/wobble-soak-timeseries.csv
      WOBBLE_SOAK_SUMMARY_PATH: ${{ runner.temp }}/wobble-soak-summary.md
      WOBBLE_SOAK_SERVER_LOG: ${{ runner.temp }}/wobble-soak-server.log

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run weekly soak against one gameplay server
        shell: bash
        run: |
          set -u -o pipefail

          node server/bootstrap.js >"$WOBBLE_SOAK_SERVER_LOG" 2>&1 &
          server_pid=$!

          cleanup() {
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              for _ in $(seq 1 40); do
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  return
                fi
                sleep 0.1
              done
              kill -9 "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 40); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Gameplay server exited before weekly soak readiness"
              tail -n 150 "$WOBBLE_SOAK_SERVER_LOG" || true
              exit 1
            fi
            if curl --fail --silent --show-error http://127.0.0.1:3000/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done

          if [ "$ready" -ne 1 ]; then
            {
              echo "### Weekly Multiplayer Soak"
              echo
              echo "**Result:** FAIL — local gameplay server did not become ready"
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 150 "$WOBBLE_SOAK_SERVER_LOG" || true
            exit 1
          fi

          set +e
          node server/soakProbe.mjs
          probe_status=$?
          node server/soakSummary.mjs
          summary_status=$?
          set -e

          if [ -f "$WOBBLE_SOAK_SUMMARY_PATH" ]; then
            cat "$WOBBLE_SOAK_SUMMARY_PATH" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$probe_status" -ne 0 ] || [ "$summary_status" -ne 0 ]; then
            echo "--- local gameplay server log ---"
            tail -n 200 "$WOBBLE_SOAK_SERVER_LOG" || true
            exit 1
          fi

      - name: Upload weekly soak telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-soak-telemetry-${{ github.run_id }}
          path: |
            ${{ env.WOBBLE_SOAK_PROBE_RESULT_PATH }}
            ${{ env.WOBBLE_SOAK_RESULT_PATH }}
            ${{ env.WOBBLE_SOAK_CSV_PATH }}
            ${{ env.WOBBLE_SOAK_SUMMARY_PATH }}
          if-no-files-found: warn
          retention-days: 21

      - name: Upload gameplay server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-soak-server-log-${{ github.run_id }}
          path: ${{ env.WOBBLE_SOAK_SERVER_LOG }}
          if-no-files-found: warn
          retention-days: 21
