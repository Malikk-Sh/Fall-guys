name: PR76 Final Privacy

on:
  push:
    branches: [feat/live-incident-diagnostics]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/live-incident-diagnostics
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply final privacy fixes
        run: python3 tools/pr76_final_privacy_fixes.py

      - name: Format changed source
        run: |
          npx prettier --write \
            server/db.js \
            server/incidentDiagnostics.js \
            server/incidentDiagnostics.test.mjs \
            server/index.js \
            server/socketAuthIntegration.test.mjs \
            server/backup.js \
            server/backup.test.mjs \
            server/adminIncidentRoutes.test.mjs \
            client/admin/admin.js \
            client/admin/index.html \
            docs/DEPLOY.md

      - name: Verify production snapshot paths
        run: |
          ! grep -F 'backupCli.mjs" snapshot "$DB"' deploy/restore.sh
          ! grep -F 'backupCli.mjs snapshot' docs/DEPLOY.md
          grep -F 'systemctl start wobble-backup.service' deploy/restore.sh
          grep -F 'systemctl start wobble-backup.service' docs/DEPLOY.md

      - name: Run focused privacy regressions
        run: |
          node --test \
            server/incidentDiagnostics.test.mjs \
            server/backup.test.mjs \
            server/adminIncidentRoutes.test.mjs \
            server/socketAuthIntegration.test.mjs \
            server/networkSanctions.test.mjs \
            server/adminOperations.test.mjs \
            server/releaseDeploy.test.mjs

      - name: Lint source
        run: npm run check

      - name: Run full unit and integration suite
        run: npm test

      - name: Commit verified privacy fixes
        run: |
          set -euo pipefail
          git restore tools/pr76_final_privacy_fixes.py .github/workflows/pr76-final-privacy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No verified privacy changes to commit.' >&2
            exit 1
          fi
          git commit -m 'Close Incident Center privacy lifecycle gaps'
          git push origin HEAD:feat/live-incident-diagnostics
