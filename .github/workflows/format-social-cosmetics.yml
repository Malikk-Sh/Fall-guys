name: Format social cosmetics

on:
  push:
    branches:
      - agent/social-cosmetics

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/social-cosmetics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write e2e/multiplayer.spec.js server/socialCosmetics.js
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- e2e/multiplayer.spec.js server/socialCosmetics.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/multiplayer.spec.js server/socialCosmetics.js
          git commit -m "Format social cosmetics changes"
          git push origin HEAD:agent/social-cosmetics
