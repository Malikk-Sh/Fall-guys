name: Temporary Prettier Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Print canonical Prettier diff
        shell: bash
        run: |
          npx prettier --write server/shadowMovementAuthorityReadiness.test.mjs
          git diff -- server/shadowMovementAuthorityReadiness.test.mjs
          exit 1
