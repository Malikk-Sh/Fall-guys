name: Verify Wobble Rush

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wobble-rush-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Print canonical reward formatting
        run: |
          npx prettier --write server/migrations/index.js server/rewardRoutes.js server/rewards.test.mjs
          git diff -- server/migrations/index.js server/rewardRoutes.js server/rewards.test.mjs
          exit 1
