name: Publish Wobble Rush Release

on:
  push:
    tags:
      - 'v*'
  # Публикацию надо уметь запускать явно, а не только пушем тега.
  #
  # Тег, созданный workflow'ом `Tag Wobble Rush Release`, уходит с GITHUB_TOKEN, а события от этого
  # токена новых запусков НЕ создают — так GitHub закрывает бесконечную рекурсию workflow'ов.
  # Исключений ровно два: workflow_dispatch и repository_dispatch. Без этого входа автоматический
  # путь оставлял бы тег созданным, но неопубликованным.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v2.6.0-beta.6'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: wobble-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Один источник имени тега на оба входа. Дальше по шагам — только он.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Require release commit to come from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          # Коммит берётся из checkout'а, а не из GITHUB_SHA. При запуске через workflow_dispatch
          # GITHUB_SHA — это голова ветки, с которой запустили, а не коммит тега: проверка смотрела
          # бы не на то и проходила бы всегда.
          head="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$head" origin/main || {
            echo "Release tags must point to a commit contained in main." >&2
            exit 1
          }

      - name: Validate release tag and project version
        run: node deploy/check-release.mjs "$RELEASE_TAG"

      - name: Check formatting
        run: npm run format:check

      - name: Lint source
        run: npm run check

      - name: Run gameplay and multiplayer tests
        run: npm test

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run two-browser multiplayer smoke test
        run: npm run test:e2e

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(
            --verify-tag
            --title "Wobble Rush ${RELEASE_TAG}"
            --generate-notes
          )
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"
