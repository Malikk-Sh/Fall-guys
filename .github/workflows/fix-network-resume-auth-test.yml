name: Fix network resume auth regression

on:
  push:
    branches:
      - agent/network-auth-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/network-auth-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update regression test
        run: node tools/fix-network-resume-auth-test.cjs
      - name: Format touched test
        run: npx prettier --write server/network.test.mjs
      - name: Commit test update
        shell: bash
        run: |
          if git diff --quiet -- server/network.test.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/network.test.mjs
          git commit -m "Update failed-resume socket auth regression"
          git push origin HEAD:agent/network-auth-hardening
