name: PR74 final review fixes

on:
  push:
    branches: [feat/maintenance-operations]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/maintenance-operations
          fetch-depth: 0

      - name: Apply reviewed restart and proxy fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper_path = Path('deploy/wobble-ops-helper.mjs')
          helper = helper_path.read_text()
          maintenance_old = """  if (spec.kind === 'maintenance') {
            if (restartInFlight && spec.enabled === false) {
              return { ok: false, reason: 'operation-busy' };
            }
            return setMaintenance(spec.enabled);
          }
          """.replace('          ', '')
          maintenance_new = """  if (spec.kind === 'maintenance') {
            // Restart owns the maintenance flag until the new PID has passed readiness. Blocking both
            // transitions prevents a manual enable during restart from being mistaken for the helper's
            // temporary flag and removed by the completion monitor.
            if (restartInFlight) return { ok: false, reason: 'operation-busy' };
            return setMaintenance(spec.enabled);
          }
          """.replace('          ', '')
          if helper.count(maintenance_old) != 1:
              raise SystemExit('unexpected maintenance serialization anchor')
          helper_path.write_text(helper.replace(maintenance_old, maintenance_new, 1))

          nginx_path = Path('deploy/nginx-locations.conf')
          nginx = nginx_path.read_text()
          health_old = """location = /health/ops {
              return 404;
          }
          """.replace('          ', '')
          health_new = """location ~* ^/health/ops$ {
              return 404;
          }
          """.replace('          ', '')
          if nginx.count(health_old) != 1:
              raise SystemExit('unexpected nginx operational health anchor')
          nginx_path.write_text(nginx.replace(health_old, health_new, 1))

          test_path = Path('server/adminOperations.test.mjs')
          tests = test_path.read_text()

          import_anchor = "const { installAdminRoutes } = require('./adminRoutes');\n"
          if tests.count(import_anchor) != 1 or "require('./operationalState')" in tests:
              raise SystemExit('unexpected operational state test import anchor')
          tests = tests.replace(
              import_anchor,
              import_anchor + "const operationalState = require('./operationalState');\n",
              1,
          )

          maintenance_test_anchor = """test('operational health parser accepts only a valid PID and drain state', async t => {
          """.replace('          ', '')
          state_test = """test('operational drain state is process-wide and one-way for the retiring process', () => {
            assert.equal(operationalState.isDraining(), false);
            assert.equal(operationalState.beginDrain(), true);
            assert.equal(operationalState.isDraining(), true);
            assert.equal(operationalState.beginDrain(), false);
          });

          test('operational health parser accepts only a valid PID and drain state', async t => {
          """.replace('          ', '')
          if tests.count(maintenance_test_anchor) != 1:
              raise SystemExit('unexpected operational state test anchor')
          tests = tests.replace(maintenance_test_anchor, state_test, 1)

          nginx_assert_anchor = """  assert.equal((nginxLocations.match(/\\/run\\/wobble-ops\\/maintenance/g) || []).length, 1);
          """.replace('          ', '')
          nginx_assert_new = nginx_assert_anchor + """  assert.match(nginxLocations, /location ~\\* \\^\\/health\\/ops\\$/);
            assert.doesNotMatch(nginxLocations, /location = \\/health\\/ops/);
          """.replace('          ', '')
          if tests.count(nginx_assert_anchor) != 1:
              raise SystemExit('unexpected nginx assertion anchor')
          tests = tests.replace(nginx_assert_anchor, nginx_assert_new, 1)

          restart_old = """  const bootstrap = fs.readFileSync(path.join(root, 'server/bootstrap.js'), 'utf8');
            const helper = fs.readFileSync(path.join(root, 'deploy/wobble-ops-helper.mjs'), 'utf8');

            assert.match(bootstrap, /const ACTIVE_MATCH_STATES = new Set\\(\\['COUNTDOWN', 'PLAYING'\\]\\)/);
            assert.match(bootstrap, /const DRAIN_TIMEOUT_MS = 180_000/);
            assert.match(bootstrap, /core\\.app\\.get\\('\\/health\\/ops'/);
            assert.match(bootstrap, /return res\\.json\\(\\{ ok: true, pid: process\\.pid, draining \\}\\)/);
            assert.match(bootstrap, /process\\.on\\('SIGUSR2', \\(\\) => beginGracefulDrain\\('SIGUSR2'\\)\\)/);
            assert.match(bootstrap, /core\\.shutdown\\(`\\$\\{signal\\}:\\$\\{reason\\}`\\)/);
          """.replace('          ', '')
          restart_new = """  const bootstrap = fs.readFileSync(path.join(root, 'server/bootstrap.js'), 'utf8');
            const index = fs.readFileSync(path.join(root, 'server/index.js'), 'utf8');
            const helper = fs.readFileSync(path.join(root, 'deploy/wobble-ops-helper.mjs'), 'utf8');

            assert.match(bootstrap, /const ACTIVE_MATCH_STATES = new Set\\(\\['COUNTDOWN', 'PLAYING'\\]\\)/);
            assert.match(bootstrap, /const DRAIN_TIMEOUT_MS = 180_000/);
            assert.match(bootstrap, /operationalState\\.beginDrain\\(\\)/);
            assert.match(bootstrap, /process\\.on\\('SIGUSR2', \\(\\) => beginGracefulDrain\\('SIGUSR2'\\)\\)/);
            assert.match(bootstrap, /core\\.shutdown\\(`\\$\\{signal\\}:\\$\\{reason\\}`\\)/);
            assert.match(index, /app\\.get\\('\\/health\\/ops'/);
            assert.match(index, /req\\.path !== '\\/health\\/ops'/);
            assert.match(index, /pid: process\\.pid, draining: operationalState\\.isDraining\\(\\)/);
            assert.match(
              index,
              /function beginCountdown\\(room\\) \\{[\\s\\S]*operationalState\\.isDraining\\(\\)[\\s\\S]*S2C\\.SERVER_SHUTDOWN/
            );
          """.replace('          ', '')
          if tests.count(restart_old) != 1:
              raise SystemExit('unexpected restart static-test anchor')
          tests = tests.replace(restart_old, restart_new, 1)

          helper_guard_anchor = """  assert.match(helper, /signal\\.reason !== 'operation-timeout'/);
          """.replace('          ', '')
          helper_guard_new = helper_guard_anchor + """  assert.match(
              helper,
              /if \\(spec\\.kind === 'maintenance'\\) \\{[\\s\\S]*if \\(restartInFlight\\) return \\{ ok: false, reason: 'operation-busy' \\}/
            );
          """.replace('          ', '')
          if tests.count(helper_guard_anchor) != 1:
              raise SystemExit('unexpected helper guard assertion anchor')
          tests = tests.replace(helper_guard_anchor, helper_guard_new, 1)

          test_path.write_text(tests)
          PY

          npx prettier --write deploy/wobble-ops-helper.mjs server/adminOperations.test.mjs
          git diff --check
          grep -n "location ~\* \^/health/ops\$" deploy/nginx-locations.conf
          grep -n "if (restartInFlight) return" deploy/wobble-ops-helper.mjs
          grep -n "operationalState.isDraining" server/index.js

      - name: Run focused operation tests
        shell: bash
        run: |
          set -euo pipefail
          node --test server/adminOperations.test.mjs

      - name: Commit final fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/wobble-ops-helper.mjs deploy/nginx-locations.conf server/adminOperations.test.mjs
          git commit -m "Close graceful restart lifecycle races"
          git push origin HEAD:feat/maintenance-operations
