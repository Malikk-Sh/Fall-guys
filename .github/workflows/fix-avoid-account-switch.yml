name: Fix avoid-list account switch race

on:
  push:
    branches: [agent/avoid-list-restore]
    paths:
      - .github/workflows/fix-avoid-account-switch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/avoid-list-restore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guard profile responses across account switches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('client/core/AccountFlow.js')
          text = p.read_text()
          replacements = [
            (
              "    this.networkTicket = null;\n    // NetworkManager",
              "    this.networkTicket = null;\n    this.profileRevision = 0;\n    // NetworkManager"
            ),
            (
              "  apply(account, { online = true, records = null, progress = null } = {}) {\n    if (records) {",
              "  apply(account, { online = true, records = null, progress = null } = {}) {\n    this.profileRevision += 1;\n    if (records) {"
            ),
            (
              "  async refreshProfile() {\n    const [profile, avoidedPlayers] = await Promise.all([\n      accountProfile().catch(() => null),\n      listAvoidedPlayers().catch(() => null)\n    ]);\n    if (profile) this.game.ui.setServerProfile(profile);\n    if (avoidedPlayers) this.game.ui.setAvoidedPlayers(avoidedPlayers);\n    return profile;\n  }",
              "  async refreshProfile() {\n    const revision = this.profileRevision;\n    const [profile, avoidedPlayers] = await Promise.all([\n      accountProfile().catch(() => null),\n      listAvoidedPlayers().catch(() => null)\n    ]);\n    // A response that started under another local/session account must never paint\n    // private profile data into the newly selected account UI.\n    if (revision !== this.profileRevision) return null;\n    if (profile) this.game.ui.setServerProfile(profile);\n    if (avoidedPlayers) this.game.ui.setAvoidedPlayers(avoidedPlayers);\n    return profile;\n  }"
            )
          ]
          for old, new in replacements:
            if text.count(old) != 1:
              raise SystemExit('AccountFlow replacement target missing or duplicated')
            text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          npx prettier --write client/core/AccountFlow.js
          npm run check
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/fix-avoid-account-switch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ignore stale profile data after account switches"
          git push origin HEAD:agent/avoid-list-restore
