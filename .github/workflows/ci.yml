name: Verify Wobble Rush

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: wobble-rush-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Сквозной тест полного матча идёт в настоящем времени: забег нельзя ускорить, сервер проверяет
    # скорость так же, как у живого игрока. Подготовительные проверки и браузерный E2E делят один
    # job, поэтому оставляем запас над обычным временем прогона вместо отмены E2E на самом финише.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # 22, а не 20: в проекте используется встроенный node:sqlite, он появился в 22.5.
      # Подпись шага раньше говорила «Node.js 20», хотя ставилась 22, — расходилась с делом.
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply exact Prettier output to PR branch
        env:
          PR_BRANCH: agent/menu-motion-ux
        run: |
          set -euo pipefail
          git fetch origin "$PR_BRANCH"
          git checkout -B "$PR_BRANCH" FETCH_HEAD
          npx prettier --write client/menu-ux.css client/ui/MenuStageExperience.js
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          text = text.replace('permissions:\n  contents: write\n', 'permissions:\n  contents: read\n')
          start = text.index('      - name: Apply exact Prettier output to PR branch\n')
          end = text.index('      # Эти проверки дешёвые', start)
          text = text[:start] + text[end:]
          path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/menu-ux.css client/ui/MenuStageExperience.js .github/workflows/ci.yml
          git commit -m 'style: format menu UX sources'
          git push origin "HEAD:$PR_BRANCH"

      # Эти проверки дешёвые и должны падать раньше долгих интеграционных и браузерных сценариев.
      # Используем grep из базового образа runner: прежний `! rg ...` превращал отсутствие ripgrep
      # в успешную проверку и фактически отключал защиту от merge markers.
      - name: Check formatting and merge artifacts
        run: |
          npm run format:check
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            .; then
            echo "Merge conflict markers found"
            exit 1
          fi

      - name: Validate production scripts
        run: bash -n deploy/install.sh deploy/backup.sh deploy/restore.sh deploy/check-backup.sh deploy/smoke.sh deploy/verify-shared443-config.sh

      - name: Verify shared-443 Nginx configuration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx libnginx-mod-stream
          bash deploy/verify-shared443-config.sh

      - name: Lint source
        run: npm run check

      - name: Run gameplay and multiplayer tests
        run: npm test

      - name: Run production backup and deploy smoke
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          server_log="$tmp_dir/server.log"
          export LEADERBOARD_DB="$tmp_dir/game.db"
          export BACKUP_DIR="$tmp_dir/backups"
          export BACKUP_STATUS_FILE="$tmp_dir/backups/status.json"
          export PORT=3100
          export HOST=127.0.0.1
          export ALLOWED_ORIGINS=http://127.0.0.1:3100
          node server/bootstrap.js >"$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true
            rm -rf "$tmp_dir"
          }
          trap cleanup EXIT

          ready=0
          for _ in {1..50}; do
            if curl -fsS --max-time 1 http://127.0.0.1:3100/health/live >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$server_log"
            exit 1
          fi

          node server/backupCli.mjs create
          if ! SMOKE_URL=http://127.0.0.1:3100 \
            SMOKE_ORIGIN=http://127.0.0.1:3100 \
            bash deploy/smoke.sh --require-backup; then
            cat "$server_log"
            exit 1
          fi

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run two-browser multiplayer smoke test
        run: npm run test:e2e

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
