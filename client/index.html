<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#6846e8"><title>Wobble Rush 3D</title><link rel="stylesheet" href="styles.css"></head>
<body><canvas id="game"></canvas><div id="error" class="toast hidden"></div>
<main id="menu" class="panel"><div class="logo"><small>WELCOME TO</small><h1>WOBBLE<br><span>RUSH 3D</span></h1><p>Dash • Bounce • Be brilliant!</p></div><div class="mode"><button class="chip active" data-mode="single">⚡ Single Player</button><button class="chip" data-mode="multi">🌐 Multiplayer</button></div><div id="single"><button id="play" class="primary">PLAY NOW <b>›</b></button><p class="hint">WASD / ARROWS TO MOVE • SPACE TO JUMP • SHIFT TO DIVE</p></div><div id="multi" class="hidden"><input id="name" maxlength="16" placeholder="Your nickname" value="Wobbler"><div class="row"><button id="create" class="primary small">CREATE ROOM</button><input id="code" maxlength="4" placeholder="CODE"><button id="join">JOIN</button></div><p id="connectStatus">Choose create or join to connect.</p></div><button id="quality" class="quality">✨ QUALITY: AUTO</button></main>
<section id="lobby" class="panel hidden"><small>ROOM CODE</small><h2 id="roomCode">----</h2><p>Share this code with your crew</p><div id="players"></div><button id="ready" class="primary">READY UP</button><button id="start" class="primary hidden">START RACE</button><button class="back">← LEAVE ROOM</button></section>
<div id="hud" class="hidden"><div><small>TIME</small><strong id="timer">00:00.00</strong></div><div><small>CHECKPOINTS</small><strong id="checks">0 / 4</strong></div><div id="placeBox"><small>POSITION</small><strong id="place">1st</strong></div></div><div id="countdown" class="hidden">3</div>
<div id="touch" class="hidden"><div id="stick"><i></i></div><button id="dive">DIVE</button><button id="jump">JUMP</button></div>
<section id="finish" class="panel hidden"><div class="trophy">🏆</div><small>COURSE COMPLETE</small><h2 id="finishTitle">BRILLIANT!</h2><p id="finishTime"></p><div id="board"></div><button id="again" class="primary">RACE AGAIN</button><button id="rematch" class="primary hidden">REMATCH</button><button class="back">RETURN HOME</button></section>
<script type="module" src="main.js"></script></body></html>
