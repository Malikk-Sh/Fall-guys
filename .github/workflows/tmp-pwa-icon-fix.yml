name: Temporary PWA icon compatibility fix

on:
  push:
    branches:
      - agent/pwa-mobile-installability-pr52

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch mobile icon references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old}')
              p.write_text(text.replace(old, new))

          replace(
              'client/index.html',
              '<link rel="apple-touch-icon" href="icons/icon-192.svg" />',
              '<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png" />',
          )
          sw = Path('client/service-worker.js')
          text = sw.read_text()
          text = text.replace("  '/icons/icon-192.svg',\n  '/icons/icon-512.svg',\n  '/icons/icon-maskable.svg'", "  '/icons/apple-touch-icon-180.png',\n  '/icons/icon-192.png',\n  '/icons/icon-512.png',\n  '/icons/icon-maskable-512.png'")
          sw.write_text(text)

          test = Path('server/pwa.test.mjs')
          text = test.read_text()
          anchor = "  assert.ok(manifest.icons.some(icon => icon.purpose === 'maskable'));"
          addition = anchor + "\n  assert.ok(manifest.icons.every(icon => icon.type === 'image/png'));"
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('manifest icon assertion anchor missing')
              text = text.replace(anchor, addition)
          test.write_text(text)

          expected = {
              'client/icons/apple-touch-icon-180.png': (180, 180),
              'client/icons/icon-192.png': (192, 192),
              'client/icons/icon-512.png': (512, 512),
              'client/icons/icon-maskable-512.png': (512, 512),
          }
          for name, size in expected.items():
              data = Path(name).read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{name} is not PNG')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != size:
                  raise SystemExit(f'{name}: {(width, height)} != {size}')
          PY
      - name: Format and targeted verify
        run: |
          npx prettier --write client/index.html client/manifest.webmanifest client/service-worker.js server/pwa.test.mjs
          node --test server/pwa.test.mjs server/pwaClient.test.mjs
          npm run lint
      - name: Commit compatibility fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/index.html client/manifest.webmanifest client/service-worker.js server/pwa.test.mjs
          git commit -m 'Harden PWA icons for iOS and raster fallback'
          git push
