name: Format account self-service

on:
  push:
    branches: [agent/account-self-service]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/account-self-service
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          client/core/AccountFlow.js
          server/accountSelfService.client.test.mjs
          server/accountSelfService.js
          server/accountSelfService.test.mjs
          server/auth.js
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/core/AccountFlow.js server/accountSelfService.client.test.mjs server/accountSelfService.js server/accountSelfService.test.mjs server/auth.js
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "Format account self-service changes"
            git push origin HEAD:agent/account-self-service
          fi
