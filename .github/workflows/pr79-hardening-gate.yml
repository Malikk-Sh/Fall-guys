name: PR79 hardening gate

on:
  push:
    branches:
      - feat/durable-operations

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/durable-operations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply fail-closed hardening
        run: |
          python scripts/pr79-hardening.py
          python scripts/pr79-hardening-followup.py
      - name: Format and lint
        run: |
          npx prettier --write \
            deploy/wobble-ops-helper.mjs \
            server/controlPlaneRoutes.js \
            server/durableOperations.test.mjs \
            client/admin/admin.js
          npm run format:check
          npm run check
          git diff --check
      - name: Focused durable operation tests
        run: |
          node --test \
            server/durableOperations.test.mjs \
            server/adminOperations.test.mjs \
            server/controlPlaneRoutes.test.mjs
      - name: Verify fail-closed contracts
        run: |
          grep -Fq "reason: 'operation-state-failed'" deploy/wobble-ops-helper.mjs
          grep -Fq "reason: 'operation-state-uncertain'" deploy/wobble-ops-helper.mjs
          grep -Fq "operation-state-uncertain" server/controlPlaneRoutes.js
          grep -Fq "The IPC boundary owns queued -> running" deploy/wobble-ops-helper.mjs
      - name: Persist checked hardening and remove temporary gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            deploy/wobble-ops-helper.mjs \
            server/controlPlaneRoutes.js \
            server/durableOperations.test.mjs \
            client/admin/admin.js
          git rm \
            .github/workflows/pr79-hardening-gate.yml \
            scripts/pr79-hardening.py \
            scripts/pr79-hardening-followup.py
          git commit -m 'Harden durable operations fail closed'
          git push origin HEAD:feat/durable-operations
