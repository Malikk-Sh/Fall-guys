name: Apply PR71 integration

on:
  push:
    branches:
      - feat/admin-infrastructure-status
    paths:
      - .github/workflows/apply-pr71.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-infrastructure-status
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 .github/apply-pr71.py
      - name: Format changed source
        run: |
          npx prettier --write \
            server/adminAuth.js \
            server/bootstrap.js \
            server/adminRoutes.js \
            server/adminInfrastructure.js \
            server/adminInfrastructure.test.mjs \
            client/admin/index.html \
            client/admin/admin.js \
            docs/README.md \
            docs/ADMIN-PANEL.md \
            docs/INFRASTRUCTURE-STATUS.md \
            package.json
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server client docs package.json
          git commit -m "Integrate read-only infrastructure status into Wobble Control"
          git push origin HEAD:feat/admin-infrastructure-status
