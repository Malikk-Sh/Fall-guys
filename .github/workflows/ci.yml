name: Verify Wobble Rush

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: wobble-rush-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply formatter and restore normal CI workflow
        shell: bash
        run: |
          set -euo pipefail
          npm run format
          git fetch origin main --no-tags
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            client/admin/admin.css \
            client/admin/admin.js \
            client/admin/index.html \
            docs/ADMIN-PANEL.md \
            server/adminAuth.js \
            server/adminControlPlane.test.mjs \
            server/adminRoutes.js
          if git diff --cached --quiet; then
            echo "Nothing to format"
            exit 0
          fi
          git commit -m "Format admin control plane"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
