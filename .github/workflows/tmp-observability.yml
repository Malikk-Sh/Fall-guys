name: Temporary observability integration

on:
  push:
    branches:
      - agent/observability-consistency
    paths:
      - .github/workflows/tmp-observability.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/observability-consistency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply observability patch
        run: node tools/apply-observability.cjs
      - name: Format permanent files
        run: >-
          npx prettier --write
          server/index.js server/test.js server/buildInfo.js server/signatureMetrics.js
          server/loadProbe.mjs server/loadProbeConfig.mjs server/loadObserver.mjs server/observability.test.mjs
          package.json package-lock.json
      - name: Lint observability changes
        run: >-
          npx eslint
          server/index.js server/test.js server/buildInfo.js server/signatureMetrics.js
          server/loadProbe.mjs server/loadProbeConfig.mjs server/loadObserver.mjs server/observability.test.mjs
      - name: Validate installer
        run: bash -n deploy/install.sh
      - name: Run full test suite
        run: npm test
      - name: Commit permanent integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/index.js server/test.js server/buildInfo.js server/signatureMetrics.js \
            server/loadProbe.mjs server/loadProbeConfig.mjs server/loadObserver.mjs server/observability.test.mjs \
            package.json package-lock.json deploy/install.sh
          git diff --cached --quiet && exit 0
          git commit -m 'Observability consistency: health, load probe and signature metrics'
          git push origin HEAD:agent/observability-consistency
