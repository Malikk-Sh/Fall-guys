name: Nightly Reliability Stress

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wobble-rush-nightly-stress
  cancel-in-progress: false

jobs:
  quality:
    name: Nightly quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run preflight checks
        run: npm run preflight

  seed-sweep:
    name: Physics seed stress
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify fixed full-match seed
        run: ONLY=130 node --experimental-loader ./server/client-loader.mjs tools/e2eSeedSweep.mjs

      - name: Sweep alternate seeds and timing modes
        shell: bash
        env:
          MIN_GOOD_SEEDS: '75'
          SEEDS: '300'
          WOBBLE_SEED_BASELINE_GOOD_SEEDS: '99'
        run: |
          set -euo pipefail

          seed_log="$RUNNER_TEMP/wobble-seed-sweep.log"
          set +e
          node --experimental-loader ./server/client-loader.mjs tools/e2eSeedSweep.mjs 2>&1 | tee "$seed_log"
          sweep_status=${PIPESTATUS[0]}
          set -e

          seed_line=$(grep '^годных сидов:' "$seed_log" | tail -n 1 || true)
          good_seeds=$(sed -n 's/^годных сидов: \([0-9][0-9]*\) из \([0-9][0-9]*\).*/\1/p' <<<"$seed_line")
          total_seeds=$(sed -n 's/^годных сидов: \([0-9][0-9]*\) из \([0-9][0-9]*\).*/\2/p' <<<"$seed_line")

          if [[ "$good_seeds" =~ ^[0-9]+$ && "$total_seeds" =~ ^[0-9]+$ ]]; then
            delta=$((good_seeds - WOBBLE_SEED_BASELINE_GOOD_SEEDS))
            if [ "$delta" -ge 0 ]; then
              delta_label="+$delta"
            else
              delta_label="$delta"
            fi
            if [ "$sweep_status" -eq 0 ]; then
              seed_status="PASS"
            else
              seed_status="FAIL"
            fi
            {
              echo "### Physics seed sweep budget"
              echo
              echo "**Result:** $seed_status"
              echo
              echo "| Metric | Current | Reference / delta | Budget | Status |"
              echo "| --- | --- | --- | --- | --- |"
              echo "| Good seeds | $good_seeds / $total_seeds | $WOBBLE_SEED_BASELINE_GOOD_SEEDS (Δ $delta_label) | minimum $MIN_GOOD_SEEDS | $seed_status |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Physics seed sweep budget"
              echo
              echo "**Result:** FAIL — sweep result could not be parsed"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$sweep_status" -eq 0 ]; then
              sweep_status=1
            fi
          fi

          exit "$sweep_status"

  server-stress:
    name: Server reliability stress
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Repeat reliability-sensitive server tests
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Reliability pass $attempt/3"
            node --test \
              server/reliability.test.mjs \
              server/dbConcurrency.test.mjs \
              server/raceMatchmaking.test.mjs \
              server/roomBotsSession.test.mjs \
              server/raceLobbyGridSession.test.mjs
          done

  server-load:
    name: Server WebSocket load
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run local WebSocket load gate
        shell: bash
        env:
          WOBBLE_LOAD_RESULT_PATH: ${{ runner.temp }}/wobble-load-result.json
          WOBBLE_LOAD_SUMMARY_PATH: ${{ runner.temp }}/wobble-load-summary.md
          WOBBLE_LOAD_BASELINE_EVENT_LOOP_P95_MS: '20.9'
          WOBBLE_LOAD_WARN_EVENT_LOOP_P95_MS: '45'
          WOBBLE_LOAD_MAX_EVENT_LOOP_P95_MS: '60'
          WOBBLE_LOAD_BASELINE_RSS_MB: '108'
          WOBBLE_LOAD_MAX_RSS_MB: '180'
        run: |
          set -euo pipefail

          server_log="$RUNNER_TEMP/wobble-load-server.log"
          node server/bootstrap.js >"$server_log" 2>&1 &
          server_pid=$!

          cleanup() {
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              for _ in $(seq 1 20); do
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  return
                fi
                sleep 0.1
              done
              kill -9 "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 40); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Gameplay server exited before readiness"
              tail -n 100 "$server_log" || true
              exit 1
            fi
            if curl --fail --silent --show-error http://127.0.0.1:3000/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done

          if [ "$ready" -ne 1 ]; then
            {
              echo "### Server WebSocket load gate"
              echo
              echo "**Result:** FAIL — local gameplay server did not become ready"
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 "$server_log" || true
            exit 1
          fi

          set +e
          node server/loadGate.mjs 24 12
          gate_status=$?
          set -e

          if [ -f "$WOBBLE_LOAD_SUMMARY_PATH" ]; then
            cat "$WOBBLE_LOAD_SUMMARY_PATH" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$gate_status" -ne 0 ]; then
            echo "--- local gameplay server log ---"
            tail -n 100 "$server_log" || true
          fi
          exit "$gate_status"

  network-e2e:
    name: Network E2E (${{ matrix.name }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop
            project: chromium
          - name: mobile
            project: mobile-chromium
    env:
      WOBBLE_E2E_RETRIES: '0'
      WOBBLE_E2E_EXCLUDE_FULL_MATCH: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Repeat matchmaking and multiplayer scenarios
        run: >-
          npx playwright test
          e2e/matchmaking.spec.js
          e2e/multiplayer.spec.js
          --project=${{ matrix.project }}
          --repeat-each=3

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-network-report-${{ matrix.name }}
          path: playwright-report/
          retention-days: 14

  full-match:
    name: Full-match stress
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WOBBLE_E2E_RETRIES: '0'
      WOBBLE_E2E_DIAGNOSTICS: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Repeat real-time full match without retries
        run: npm run test:e2e:full-match -- --repeat-each=3

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-full-match-report
          path: playwright-report/
          retention-days: 14

  summary:
    name: Nightly reliability ready
    if: always()
    needs: [quality, seed-sweep, server-stress, server-load, network-e2e, full-match]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Summarize stress groups
        env:
          QUALITY: ${{ needs.quality.result }}
          SEEDS: ${{ needs.seed-sweep.result }}
          SERVER: ${{ needs.server-stress.result }}
          SERVER_LOAD: ${{ needs.server-load.result }}
          NETWORK: ${{ needs.network-e2e.result }}
          FULL_MATCH: ${{ needs.full-match.result }}
        shell: bash
        run: |
          {
            echo "### Nightly reliability stress"
            echo
            echo "| Group | Result |"
            echo "| --- | --- |"
            echo "| Quality | $QUALITY |"
            echo "| Physics seed stress | $SEEDS |"
            echo "| Server reliability | $SERVER |"
            echo "| Server WebSocket load | $SERVER_LOAD |"
            echo "| Network browser E2E | $NETWORK |"
            echo "| Full-match stress | $FULL_MATCH |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for result in "$QUALITY" "$SEEDS" "$SERVER" "$SERVER_LOAD" "$NETWORK" "$FULL_MATCH"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
