name: Diagnose network auth tests

on:
  push:
    branches:
      - agent/network-auth-hardening

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/network-auth-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture npm test
        shell: bash
        run: |
          set +e
          npm test > /tmp/network-auth-test.log 2>&1
          code=$?
          tail -n 500 /tmp/network-auth-test.log > ci-network-auth-failure.log
          echo "exit_code=$code" >> ci-network-auth-failure.log
          exit 0
      - name: Commit diagnostic tail
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-network-auth-failure.log
          git commit -m "Capture network auth test diagnostics"
          git push origin HEAD:agent/network-auth-hardening
