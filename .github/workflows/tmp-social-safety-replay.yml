name: Temporary social safety integration

on:
  push:
    branches:
      - agent/social-safety-replay
    paths:
      - .github/workflows/tmp-social-safety-replay.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/social-safety-replay
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply social safety patch
        run: node tools/apply-social-safety-replay.cjs
      - name: Format permanent files
        run: >-
          npx prettier --write
          server/migrations/007_social_safety.js server/migrations/index.js server/socialSafety.js server/socialRoutes.js
          server/socialSafety.test.mjs server/migrations.test.mjs server/socialProfile.test.mjs server/test.js
          server/index.js server/bootstrap.js client/core/account.js client/core/AccountFlow.js client/core/invite.js
          client/ui/UI.js client/ui/menuBindings.js client/net/networkBindings.js client/index.html client/styles.css
          server/invite.test.mjs package.json package-lock.json
      - name: Lint social safety changes
        run: >-
          npx eslint
          server/socialSafety.js server/socialRoutes.js server/socialSafety.test.mjs server/index.js server/bootstrap.js
          client/core/account.js client/core/AccountFlow.js client/core/invite.js client/ui/UI.js client/ui/menuBindings.js
          client/net/networkBindings.js server/invite.test.mjs server/test.js
      - name: Run full test suite
        run: npm test
      - name: Commit permanent integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/migrations/007_social_safety.js server/migrations/index.js server/socialSafety.js server/socialRoutes.js \
            server/socialSafety.test.mjs server/migrations.test.mjs server/socialProfile.test.mjs server/test.js \
            server/index.js server/bootstrap.js client/core/account.js client/core/AccountFlow.js client/core/invite.js \
            client/ui/UI.js client/ui/menuBindings.js client/net/networkBindings.js client/index.html client/styles.css \
            server/invite.test.mjs package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Social safety and better replay flow'
          git push origin HEAD:agent/social-safety-replay
