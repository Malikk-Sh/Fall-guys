name: PR75 Stage Player Support Center

on:
  push:
    branches: [feat/player-support-center]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/player-support-center
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply support-center patch
        run: python3 tools/pr75_patch.py

      - name: Format changed source
        run: |
          npx prettier --write \
            server/auth.js \
            server/networkIdentity.js \
            server/index.js \
            server/adminAuth.js \
            server/adminPlayerSupport.js \
            server/adminControl.js \
            server/adminRoutes.js \
            server/bootstrap.js \
            server/adminPlayerSupport.test.mjs \
            server/adminPlayerSupportRoutes.test.mjs \
            server/networkIdentity.test.mjs \
            client/admin/index.html \
            client/admin/admin.css \
            client/admin/admin.js

      - name: Run focused support tests
        run: |
          node --test \
            server/adminPlayerSupport.test.mjs \
            server/adminPlayerSupportRoutes.test.mjs \
            server/networkIdentity.test.mjs \
            server/auth.test.mjs \
            server/adminControlPlane.test.mjs

      - name: Lint source
        run: npm run check

      - name: Run full unit and integration suite
        run: npm test

      - name: Commit verified implementation
        run: |
          set -euo pipefail
          git rm tools/pr75_patch.py .github/workflows/pr75-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build player support center'
          git push origin HEAD:feat/player-support-center
