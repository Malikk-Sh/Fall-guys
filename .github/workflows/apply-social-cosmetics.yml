name: Apply social cosmetics patches

on:
  push:
    branches:
      - agent/social-cosmetics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/social-cosmetics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply narrow patches
        run: node tools/apply-social-cosmetics.cjs
      - name: Format touched files
        run: npx prettier --write server/index.js client/main.js client/ui/UI.js client/styles.css
      - name: Commit production changes
        shell: bash
        run: |
          if git diff --quiet -- server/index.js client/main.js client/ui/UI.js client/styles.css; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js client/main.js client/ui/UI.js client/styles.css
          git commit -m "Show authoritative cosmetics to other players"
          git push origin HEAD:agent/social-cosmetics
