name: Temporary co-op integrity integration

on:
  push:
    branches:
      - agent/coop-integrity
    paths:
      - .github/workflows/tmp-coop-integrity.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/coop-integrity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply co-op integrity patch
        run: node tools/apply-coop-integrity.cjs
      - name: Update legacy integration scenarios
        run: node tools/apply-coop-integrity-test-updates.cjs
      - name: Format permanent files
        run: >-
          npx prettier --write
          server/index.js server/test.js server/integration.test.js
          server/coopMovementAudit.js server/coopMovementAudit.test.mjs
          server/verifiedLeaderboard.js server/verifiedLeaderboard.test.mjs server/observability.test.mjs
          package.json package-lock.json README.md
      - name: Lint co-op integrity changes
        run: >-
          npx eslint
          server/index.js server/test.js server/integration.test.js
          server/coopMovementAudit.js server/coopMovementAudit.test.mjs
          server/verifiedLeaderboard.js server/verifiedLeaderboard.test.mjs server/observability.test.mjs
      - name: Run co-op integrity tests first
        run: node --test server/coopMovementAudit.test.mjs server/verifiedLeaderboard.test.mjs server/test.js
      - name: Run competitive co-op integration
        run: node --test --test-name-pattern='запас отклонений|пройденная кооп-глава' server/integration.test.js
      - name: Run full test suite
        run: npm test
      - name: Commit permanent integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/index.js server/test.js server/integration.test.js \
            server/coopMovementAudit.js server/coopMovementAudit.test.mjs \
            server/verifiedLeaderboard.js server/verifiedLeaderboard.test.mjs server/observability.test.mjs \
            package.json package-lock.json README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Co-op integrity: verify movement and competitive records'
          git push origin HEAD:agent/coop-integrity
