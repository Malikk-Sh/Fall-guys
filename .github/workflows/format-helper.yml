name: Temporary format helper

on:
  push:
    branches:
      - agent/race-finish-cutover-verification

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: agent/race-finish-cutover-verification
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Apply Prettier
        run: npx prettier --write server/raceProgressAuthorityBoundaryVerification.test.mjs server/shadowRaceAuthorityService.js
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/raceProgressAuthorityBoundaryVerification.test.mjs server/shadowRaceAuthorityService.js
          git commit -m "Apply Prettier formatting"
          git push origin HEAD:agent/race-finish-cutover-verification
