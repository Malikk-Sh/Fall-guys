name: Temp format PR70

on:
  push:
    branches:
      - feat/admin-safe-operations
    paths:
      - .github/workflows/tmp-format-pr70.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-safe-operations
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/OPERATIONS-CONTROL.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/OPERATIONS-CONTROL.md
          git commit -m "Format safe operations guide"
          git push origin HEAD:feat/admin-safe-operations
