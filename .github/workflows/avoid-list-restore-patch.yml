name: Build avoid list and restore

on:
  push:
    branches: [agent/avoid-list-restore]
    paths:
      - .github/workflows/avoid-list-restore-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/avoid-list-restore
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Implement directional avoid list and restore
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {found}")
              p.write_text(text.replace(old, new, count))

          Path('server/migrations/008_directional_avoids.js').write_text("""module.exports = {
            version: 8,
            sql: `
              ALTER TABLE matchmaking_avoids ADD COLUMN account_a_avoided_at INTEGER;
              ALTER TABLE matchmaking_avoids ADD COLUMN account_b_avoided_at INTEGER;

              UPDATE matchmaking_avoids
              SET account_a_avoided_at = CASE
                    WHEN created_by_account_id = account_a THEN created_at
                    ELSE NULL
                  END,
                  account_b_avoided_at = CASE
                    WHEN created_by_account_id = account_b THEN created_at
                    ELSE NULL
                  END;

              CREATE INDEX IF NOT EXISTS idx_matchmaking_avoids_a_active
                ON matchmaking_avoids (account_a, account_a_avoided_at DESC);
              CREATE INDEX IF NOT EXISTS idx_matchmaking_avoids_b_active
                ON matchmaking_avoids (account_b, account_b_avoided_at DESC);
            `
          };
          """)

          Path('server/socialSafety.js').write_text("""'use strict';

          const REPORT_REASONS = Object.freeze(['afk', 'griefing', 'offensive-name', 'exploit-cheat']);
          const REPORT_REASON_SET = new Set(REPORT_REASONS);
          const REPORT_COOLDOWN_MS = 6 * 60 * 60 * 1000;

          function pairFor(first, second) {
            const a = String(first || '');
            const b = String(second || '');
            if (!a || !b || a === b) return null;
            return a < b ? [a, b] : [b, a];
          }

          class SocialSafety {
            constructor({ db, reportCooldownMs = REPORT_COOLDOWN_MS } = {}) {
              if (!db) throw new Error('SocialSafety требует открытую базу');
              this.db = db;
              this.reportCooldownMs = reportCooldownMs;
              this.statements = prepare(db);
            }

            isRecentPartner(accountId, targetAccountId) {
              const pair = pairFor(accountId, targetAccountId);
              if (!pair) return false;
              const latest = this.statements.latestPartner.get(String(accountId));
              return latest?.partner_account_id === String(targetAccountId);
            }

            shouldAvoid(firstAccountId, secondAccountId) {
              const pair = pairFor(firstAccountId, secondAccountId);
              if (!pair) return false;
              const row = this.statements.avoidPair.get(pair[0], pair[1]);
              return Boolean(row && (row.account_a_avoided_at != null || row.account_b_avoided_at != null));
            }

            listAvoided(accountId) {
              const actor = String(accountId || '');
              if (!actor || !this.statements.account.get(actor)) return [];
              return this.statements.listAvoided
                .all(actor, actor, actor, actor, actor)
                .map(row => ({
                  id: row.target_account_id,
                  name: row.display_name || 'Wobbler',
                  avoidedAt: Number(row.avoided_at || 0)
                }));
            }

            avoid({ accountId, targetAccountId, now = Date.now() }) {
              const pair = pairFor(accountId, targetAccountId);
              if (!pair) return { ok: false, reason: 'invalid-target' };
              const actor = String(accountId || '');
              const target = String(targetAccountId || '');
              if (!this.statements.account.get(actor) || !this.statements.account.get(target)) {
                return { ok: false, reason: 'unknown-account' };
              }
              if (!this.isRecentPartner(actor, target)) return { ok: false, reason: 'not-recent-partner' };
              const at = Number.isFinite(now) && now >= 0 ? Math.round(now) : Date.now();
              const current = this.statements.avoidPair.get(pair[0], pair[1]);
              const actorIsA = actor === pair[0];
              const alreadyAvoided = actorIsA
                ? current?.account_a_avoided_at != null
                : current?.account_b_avoided_at != null;
              if (actorIsA) this.statements.upsertAvoidA.run(pair[0], pair[1], actor, at, at);
              else this.statements.upsertAvoidB.run(pair[0], pair[1], actor, at, at);
              return { ok: true, avoided: true, created: !alreadyAvoided };
            }

            unavoid({ accountId, targetAccountId }) {
              const pair = pairFor(accountId, targetAccountId);
              if (!pair) return { ok: false, reason: 'invalid-target' };
              const actor = String(accountId || '');
              const target = String(targetAccountId || '');
              if (!this.statements.account.get(actor) || !this.statements.account.get(target)) {
                return { ok: false, reason: 'unknown-account' };
              }
              const current = this.statements.avoidPair.get(pair[0], pair[1]);
              const actorIsA = actor === pair[0];
              const active = actorIsA
                ? current?.account_a_avoided_at != null
                : current?.account_b_avoided_at != null;
              if (!active) return { ok: true, avoided: false, removed: false };
              if (actorIsA) this.statements.clearAvoidA.run(pair[0], pair[1]);
              else this.statements.clearAvoidB.run(pair[0], pair[1]);
              this.statements.deleteEmptyAvoid.run(pair[0], pair[1]);
              return { ok: true, avoided: false, removed: true };
            }

            report({ accountId, targetAccountId, reason, now = Date.now() }) {
              const reporter = String(accountId || '');
              const target = String(targetAccountId || '');
              const normalizedReason = String(reason || '');
              if (!pairFor(reporter, target)) return { ok: false, reason: 'invalid-target' };
              if (!REPORT_REASON_SET.has(normalizedReason)) return { ok: false, reason: 'invalid-reason' };
              if (!this.statements.account.get(reporter) || !this.statements.account.get(target)) {
                return { ok: false, reason: 'unknown-account' };
              }
              if (!this.isRecentPartner(reporter, target)) return { ok: false, reason: 'not-recent-partner' };

              const at = Number.isFinite(now) && now >= 0 ? Math.round(now) : Date.now();
              const previous = this.statements.report.get(reporter, target, normalizedReason);
              if (previous && at - Number(previous.last_reported_at || 0) < this.reportCooldownMs) {
                return {
                  ok: true,
                  accepted: false,
                  duplicate: true,
                  reportCount: Number(previous.report_count || 1)
                };
              }

              this.statements.upsertReport.run(reporter, target, normalizedReason, at, at);
              const saved = this.statements.report.get(reporter, target, normalizedReason);
              return {
                ok: true,
                accepted: true,
                duplicate: false,
                reportCount: Number(saved?.report_count || 1)
              };
            }
          }

          function prepare(db) {
            return {
              account: db.prepare('SELECT 1 AS present FROM accounts WHERE id = ?'),
              latestPartner: db.prepare(`
                SELECT partner_account_id
                FROM recent_partners
                WHERE account_id = ?
                ORDER BY last_played_at DESC, partner_account_id ASC
                LIMIT 1
              `),
              avoidPair: db.prepare(`
                SELECT account_a_avoided_at, account_b_avoided_at
                FROM matchmaking_avoids
                WHERE account_a = ? AND account_b = ?
              `),
              listAvoided: db.prepare(`
                SELECT
                  CASE WHEN ma.account_a = ? THEN ma.account_b ELSE ma.account_a END AS target_account_id,
                  a.display_name,
                  CASE
                    WHEN ma.account_a = ? THEN ma.account_a_avoided_at
                    ELSE ma.account_b_avoided_at
                  END AS avoided_at
                FROM matchmaking_avoids ma
                JOIN accounts a
                  ON a.id = CASE WHEN ma.account_a = ? THEN ma.account_b ELSE ma.account_a END
                WHERE (ma.account_a = ? AND ma.account_a_avoided_at IS NOT NULL)
                   OR (ma.account_b = ? AND ma.account_b_avoided_at IS NOT NULL)
                ORDER BY avoided_at DESC, target_account_id ASC
              `),
              upsertAvoidA: db.prepare(`
                INSERT INTO matchmaking_avoids
                  (account_a, account_b, created_by_account_id, created_at, account_a_avoided_at)
                VALUES (?, ?, ?, ?, ?)
                ON CONFLICT (account_a, account_b) DO UPDATE SET
                  account_a_avoided_at = COALESCE(account_a_avoided_at, excluded.account_a_avoided_at)
              `),
              upsertAvoidB: db.prepare(`
                INSERT INTO matchmaking_avoids
                  (account_a, account_b, created_by_account_id, created_at, account_b_avoided_at)
                VALUES (?, ?, ?, ?, ?)
                ON CONFLICT (account_a, account_b) DO UPDATE SET
                  account_b_avoided_at = COALESCE(account_b_avoided_at, excluded.account_b_avoided_at)
              `),
              clearAvoidA: db.prepare(`
                UPDATE matchmaking_avoids SET account_a_avoided_at = NULL
                WHERE account_a = ? AND account_b = ?
              `),
              clearAvoidB: db.prepare(`
                UPDATE matchmaking_avoids SET account_b_avoided_at = NULL
                WHERE account_a = ? AND account_b = ?
              `),
              deleteEmptyAvoid: db.prepare(`
                DELETE FROM matchmaking_avoids
                WHERE account_a = ? AND account_b = ?
                  AND account_a_avoided_at IS NULL AND account_b_avoided_at IS NULL
              `),
              report: db.prepare(`
                SELECT report_count, last_reported_at
                FROM social_reports
                WHERE reporter_account_id = ? AND target_account_id = ? AND reason = ?
              `),
              upsertReport: db.prepare(`
                INSERT INTO social_reports
                  (reporter_account_id, target_account_id, reason, report_count, first_reported_at, last_reported_at)
                VALUES (?, ?, ?, 1, ?, ?)
                ON CONFLICT (reporter_account_id, target_account_id, reason) DO UPDATE SET
                  report_count = report_count + 1,
                  last_reported_at = excluded.last_reported_at
              `)
            };
          }

          module.exports = { SocialSafety, REPORT_REASONS, REPORT_COOLDOWN_MS, pairFor };
          """)

          Path('server/socialRoutes.js').write_text("""'use strict';

          const express = require('express');
          const { REPORT_REASONS } = require('./socialSafety');

          const keysOnly = (body, allowed) =>
            body && typeof body === 'object' && !Array.isArray(body)
              ? Object.keys(body).every(key => allowed.has(key))
              : false;

          function statusFor(reason) {
            if (reason === 'unknown-account') return 404;
            if (reason === 'not-recent-partner') return 403;
            return 400;
          }

          function installSocialRoutes({ app, socialSafety, requireSession }) {
            if (!app || !socialSafety || typeof requireSession !== 'function') {
              throw new Error('Social routes требуют app, SocialSafety и requireSession');
            }
            const json = express.json({ limit: '4kb' });

            app.post('/api/social/avoid', json, (req, res) => {
              const session = requireSession(req, res);
              if (!session) return undefined;
              if (!keysOnly(req.body, new Set(['targetAccountId']))) {
                return res.status(400).json({ ok: false, error: 'invalid-payload' });
              }
              const result = socialSafety.avoid({
                accountId: session.accountId,
                targetAccountId: req.body?.targetAccountId
              });
              res.setHeader('Cache-Control', 'no-store');
              if (!result.ok) return res.status(statusFor(result.reason)).json({ ok: false, error: result.reason });
              return res.json({ ok: true, avoided: true, created: result.created });
            });

            app.post('/api/social/avoids', json, (req, res) => {
              const session = requireSession(req, res);
              if (!session) return undefined;
              if (!keysOnly(req.body, new Set())) {
                return res.status(400).json({ ok: false, error: 'invalid-payload' });
              }
              res.setHeader('Cache-Control', 'no-store');
              return res.json({ ok: true, players: socialSafety.listAvoided(session.accountId) });
            });

            app.post('/api/social/unavoid', json, (req, res) => {
              const session = requireSession(req, res);
              if (!session) return undefined;
              if (!keysOnly(req.body, new Set(['targetAccountId']))) {
                return res.status(400).json({ ok: false, error: 'invalid-payload' });
              }
              const result = socialSafety.unavoid({
                accountId: session.accountId,
                targetAccountId: req.body?.targetAccountId
              });
              res.setHeader('Cache-Control', 'no-store');
              if (!result.ok) return res.status(statusFor(result.reason)).json({ ok: false, error: result.reason });
              return res.json({ ok: true, avoided: false, removed: result.removed });
            });

            app.post('/api/social/report', json, (req, res) => {
              const session = requireSession(req, res);
              if (!session) return undefined;
              if (!keysOnly(req.body, new Set(['targetAccountId', 'reason']))) {
                return res.status(400).json({ ok: false, error: 'invalid-payload' });
              }
              const result = socialSafety.report({
                accountId: session.accountId,
                targetAccountId: req.body?.targetAccountId,
                reason: req.body?.reason
              });
              res.setHeader('Cache-Control', 'no-store');
              if (!result.ok) {
                return res.status(statusFor(result.reason)).json({
                  ok: false,
                  error: result.reason,
                  ...(result.reason === 'invalid-reason' ? { allowedReasons: REPORT_REASONS } : {})
                });
              }
              return res.json({
                ok: true,
                accepted: result.accepted,
                duplicate: result.duplicate,
                reportCount: result.reportCount
              });
            });
          }

          module.exports = { installSocialRoutes, keysOnly };
          """)

          replace(
              'server/migrations/index.js',
              "const socialSafety = require('./007_social_safety');\n",
              "const socialSafety = require('./007_social_safety');\nconst directionalAvoids = require('./008_directional_avoids');\n"
          )
          replace(
              'server/migrations/index.js',
              "  recentPartners,\n  socialSafety\n]);",
              "  recentPartners,\n  socialSafety,\n  directionalAvoids\n]);"
          )

          replace(
              'server/accounts.js',
              """   EXISTS (\n     SELECT 1 FROM matchmaking_avoids ma\n     WHERE (ma.account_a = rp.account_id AND ma.account_b = rp.partner_account_id)\n        OR (ma.account_a = rp.partner_account_id AND ma.account_b = rp.account_id)\n   ) AS avoided""",
              """   EXISTS (\n     SELECT 1 FROM matchmaking_avoids ma\n     WHERE (\n       ma.account_a = rp.account_id\n       AND ma.account_b = rp.partner_account_id\n       AND ma.account_a_avoided_at IS NOT NULL\n     ) OR (\n       ma.account_b = rp.account_id\n       AND ma.account_a = rp.partner_account_id\n       AND ma.account_b_avoided_at IS NOT NULL\n     )\n   ) AS avoided"""
          )

          replace(
              'client/core/account.js',
              """export async function avoidRecentPartner(targetAccountId, options) {\n  const { ok, data } = await post('/api/social/avoid', { targetAccountId }, options);\n  return ok ? data : null;\n}\n\nexport async function reportRecentPartner""",
              """export async function avoidRecentPartner(targetAccountId, options) {\n  const { ok, data } = await post('/api/social/avoid', { targetAccountId }, options);\n  return ok ? data : null;\n}\n\nexport async function listAvoidedPlayers(options) {\n  const { ok, data } = await post('/api/social/avoids', {}, options);\n  return ok && Array.isArray(data?.players) ? data.players : null;\n}\n\nexport async function restoreAvoidedPlayer(targetAccountId, options) {\n  const { ok, data } = await post('/api/social/unavoid', { targetAccountId }, options);\n  return ok ? data : null;\n}\n\nexport async function reportRecentPartner"""
          )

          replace(
              'client/core/AccountFlow.js',
              """  avoidRecentPartner,\n  listAccounts,""",
              """  avoidRecentPartner,\n  listAvoidedPlayers,\n  listAccounts,"""
          )
          replace(
              'client/core/AccountFlow.js',
              """  reportRecentPartner,\n  sessionAccount,""",
              """  reportRecentPartner,\n  restoreAvoidedPlayer,\n  sessionAccount,"""
          )
          replace(
              'client/core/AccountFlow.js',
              """    this.game.ui.onRecentPartnerAvoid = partner => this.avoidPartner(partner);\n    this.game.ui.onRecentPartnerReport = (partner, reason) => this.reportPartner(partner, reason);""",
              """    this.game.ui.onRecentPartnerAvoid = partner => this.avoidPartner(partner);\n    this.game.ui.onRecentPartnerReport = (partner, reason) => this.reportPartner(partner, reason);\n    this.game.ui.onAvoidedPlayerRestore = player => this.restorePlayer(player);"""
          )
          replace(
              'client/core/AccountFlow.js',
              """    this.game.ui.setServerProfile(online ? account?.profile || null : null);\n    this.game.ui.setAccountList(listAccounts());""",
              """    this.game.ui.setServerProfile(online ? account?.profile || null : null);\n    this.game.ui.setAvoidedPlayers(null);\n    this.game.ui.setAccountList(listAccounts());"""
          )
          replace(
              'client/core/AccountFlow.js',
              """  async refreshProfile() {\n    try {\n      const profile = await accountProfile();\n      if (profile) this.game.ui.setServerProfile(profile);\n      return profile;\n    } catch {\n      return null;\n    }\n  }""",
              """  async refreshProfile() {\n    const [profile, avoidedPlayers] = await Promise.all([\n      accountProfile().catch(() => null),\n      listAvoidedPlayers().catch(() => null)\n    ]);\n    if (profile) this.game.ui.setServerProfile(profile);\n    if (avoidedPlayers) this.game.ui.setAvoidedPlayers(avoidedPlayers);\n    return profile;\n  }"""
          )
          replace(
              'client/core/AccountFlow.js',
              """  async reportPartner(partner, reason) {""",
              """  async restorePlayer(player) {\n    if (!player?.id) return null;\n    try {\n      const result = await restoreAvoidedPlayer(player.id);\n      if (!result) return this.game.ui.toast('Не удалось вернуть игрока в подбор.');\n      await this.refreshProfile();\n      this.game.ui.toast('Ваше исключение снято — игрок снова разрешён для быстрого подбора.');\n      return result;\n    } catch {\n      this.game.ui.toast('Не удалось вернуть игрока в подбор.');\n      return null;\n    }\n  }\n\n  async reportPartner(partner, reason) {"""
          )

          replace(
              'client/index.html',
              """        </section>\n      </div>\n    </section>\n\n    <!-- Экран настроек управления.""",
              """        </section>\n        <section class=\"profile-section\" aria-labelledby=\"avoidedPlayersTitle\">\n          <div class=\"profile-section-head\">\n            <small id=\"avoidedPlayersTitle\">ИСКЛЮЧЁННЫЕ ИГРОКИ</small><span>ВАШ ВЫБОР</span>\n          </div>\n          <p id=\"avoidedPlayersEmpty\" class=\"recent-partner-empty\">Загрузка списка…</p>\n          <div id=\"avoidedPlayersList\" class=\"avoided-players-list\"></div>\n          <small class=\"avoid-privacy-note\">\n            Здесь видны только ваши исключения. Решения других игроков о подборе не раскрываются.\n          </small>\n        </section>\n      </div>\n    </section>\n\n    <!-- Экран настроек управления."""
          )

          replace(
              'client/ui/UI.js',
              """      if (show) {\n        this.renderServerProfile();\n        this.onProfileRefresh?.();\n      }""",
              """      if (show) {\n        this.renderServerProfile();\n        this.renderAvoidedPlayers();\n        this.onProfileRefresh?.();\n      }"""
          )
          replace(
              'client/ui/UI.js',
              """    selectAll('[data-social-report]').forEach(button =>\n      button.addEventListener('click', () => {\n        const partner = this.serverProfile?.recentPartner;\n        if (!partner) return;\n        $('#recentPartnerReportReasons').classList.add('hidden');\n        this.onRecentPartnerReport?.(partner, button.dataset.socialReport);\n      })\n    );\n  }""",
              """    selectAll('[data-social-report]').forEach(button =>\n      button.addEventListener('click', () => {\n        const partner = this.serverProfile?.recentPartner;\n        if (!partner) return;\n        $('#recentPartnerReportReasons').classList.add('hidden');\n        this.onRecentPartnerReport?.(partner, button.dataset.socialReport);\n      })\n    );\n    $('#avoidedPlayersList').addEventListener('click', event => {\n      const button = event.target.closest?.('[data-restore-avoid]');\n      if (!button) return;\n      const player = this.avoidedPlayers?.find(item => item.id === button.dataset.restoreAvoid);\n      if (!player) return;\n      if (button.dataset.confirmRestore !== '1') {\n        selectAll('[data-restore-avoid]').forEach(item => {\n          item.dataset.confirmRestore = '';\n          item.textContent = 'ВЕРНУТЬ В ПОДБОР';\n        });\n        button.dataset.confirmRestore = '1';\n        button.textContent = 'ПОДТВЕРДИТЬ';\n        return;\n      }\n      button.disabled = true;\n      this.onAvoidedPlayerRestore?.(player);\n    });\n  }"""
          )
          replace(
              'client/ui/UI.js',
              """  setServerProfile(profile) {\n    this.serverProfile = profile || null;\n    this.renderServerProfile();\n  }\n\n  renderServerProfile()""",
              """  setServerProfile(profile) {\n    this.serverProfile = profile || null;\n    this.renderServerProfile();\n  }\n\n  setAvoidedPlayers(players) {\n    this.avoidedPlayers = Array.isArray(players) ? players : null;\n    this.renderAvoidedPlayers();\n  }\n\n  renderAvoidedPlayers() {\n    const list = $('#avoidedPlayersList');\n    const empty = $('#avoidedPlayersEmpty');\n    if (!list || !empty) return;\n    list.replaceChildren();\n    if (!Array.isArray(this.avoidedPlayers)) {\n      empty.classList.remove('hidden');\n      empty.textContent = 'Загрузка списка…';\n      return;\n    }\n    empty.classList.toggle('hidden', this.avoidedPlayers.length > 0);\n    empty.textContent = 'Вы никого не исключали из быстрого подбора.';\n    for (const player of this.avoidedPlayers) {\n      const row = document.createElement('div');\n      row.className = 'avoided-player-row';\n      const copy = document.createElement('span');\n      const name = document.createElement('strong');\n      name.textContent = player.name || 'Wobbler';\n      const detail = document.createElement('small');\n      detail.textContent = 'НЕ ПОПАДЁТ В ВАШ БЫСТРЫЙ ПОДБОР';\n      copy.append(name, detail);\n      const restore = document.createElement('button');\n      restore.type = 'button';\n      restore.className = 'button button-secondary';\n      restore.dataset.restoreAvoid = player.id;\n      restore.textContent = 'ВЕРНУТЬ В ПОДБОР';\n      row.append(copy, restore);\n      list.append(row);\n    }\n  }\n\n  renderServerProfile()"""
          )

          Path('client/styles.css').write_text(Path('client/styles.css').read_text() + """

          .avoided-players-list {
            display: grid;
            gap: 8px;
          }
          .avoided-player-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border: 1px solid #ffffff1f;
            border-radius: 12px;
            background: #ffffff0a;
          }
          .avoided-player-row > span {
            display: grid;
            gap: 3px;
            min-width: 0;
          }
          .avoided-player-row strong,
          .avoided-player-row small {
            overflow: hidden;
            text-overflow: ellipsis;
          }
          .avoided-player-row small,
          .avoid-privacy-note {
            color: #ffffff9c;
            font-size: 8px;
            line-height: 1.45;
          }
          .avoid-privacy-note {
            display: block;
            margin-top: 8px;
          }
          @media (max-width: 760px) {
            .avoided-player-row {
              grid-template-columns: 1fr;
            }
            .avoided-player-row .button {
              width: 100%;
            }
          }
          """)

          # Migrations and regression coverage.
          replace(
              'server/migrations.test.mjs',
              "const { migrateDatabase } = require('./migrations');",
              "const { MIGRATIONS, migrateDatabase } = require('./migrations');"
          )
          replace(
              'server/migrations.test.mjs',
              "assert.deepEqual(migrateDatabase(db, { now: 123 }), [1, 2, 3, 4, 5, 6, 7]);",
              "assert.deepEqual(migrateDatabase(db, { now: 123 }), [1, 2, 3, 4, 5, 6, 7, 8]);"
          )
          replace(
              'server/migrations.test.mjs',
              """    { version: 6, applied_at: 123 },\n    { version: 7, applied_at: 123 }""",
              """    { version: 6, applied_at: 123 },\n    { version: 7, applied_at: 123 },\n    { version: 8, applied_at: 123 }"""
          )
          marker = "test('неудачная миграция откатывает и схему, и отметку версии', () => {"
          migration_test = """test('migration 008 preserves old avoid as the creator personal choice', () => {\n  const db = openDatabase(':memory:');\n  migrateDatabase(db, { migrations: MIGRATIONS.slice(0, 7), now: 100 });\n  db.prepare(\n    'INSERT INTO accounts (id, display_name, secret_hash, created_at, last_seen_at) VALUES (?, ?, ?, ?, ?)'\n  ).run('a', 'Первый', 'hash-a', 1, 1);\n  db.prepare(\n    'INSERT INTO accounts (id, display_name, secret_hash, created_at, last_seen_at) VALUES (?, ?, ?, ?, ?)'\n  ).run('b', 'Второй', 'hash-b', 1, 1);\n  db.prepare(\n    'INSERT INTO matchmaking_avoids (account_a, account_b, created_by_account_id, created_at) VALUES (?, ?, ?, ?)'\n  ).run('a', 'b', 'a', 55);\n\n  assert.deepEqual(migrateDatabase(db, { now: 200 }), [8]);\n  const row = db\n    .prepare(\n      'SELECT account_a_avoided_at, account_b_avoided_at FROM matchmaking_avoids WHERE account_a = ? AND account_b = ?'\n    )\n    .get('a', 'b');\n  assert.deepEqual({ ...row }, { account_a_avoided_at: 55, account_b_avoided_at: null });\n  db.close();\n});\n\n"""
          replace('server/migrations.test.mjs', marker, migration_test + marker)

          Path('server/socialSafety.test.mjs').write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';

          const require = createRequire(import.meta.url);
          const express = require('express');
          const { openDatabase } = require('./db');
          const { Accounts } = require('./accounts');
          const { SocialSafety, REPORT_REASONS, pairFor } = require('./socialSafety');
          const { installSocialRoutes, keysOnly } = require('./socialRoutes');

          function fresh() {
            const db = openDatabase(':memory:');
            const accounts = new Accounts({ db });
            const social = new SocialSafety({ db, reportCooldownMs: 1000 });
            return { db, accounts, social };
          }

          function partnered(context) {
            const first = context.accounts.create('Первый');
            const second = context.accounts.create('Второй');
            context.accounts.recordCoopPartners({
              accountIds: [first.id, second.id],
              chapterId: 'ch4',
              playedAt: 100
            });
            return { first, second };
          }

          async function listen(app) {
            const server = await new Promise(resolve => {
              const opened = app.listen(0, '127.0.0.1', () => resolve(opened));
            });
            return {
              url: `http://127.0.0.1:${server.address().port}`,
              close: () => new Promise(resolve => server.close(resolve))
            };
          }

          test('avoid remains symmetric for matchmaking but each player owns their personal choice', () => {
            const context = fresh();
            const { first, second } = partnered(context);
            const stranger = context.accounts.create('Незнакомец');

            assert.deepEqual(pairFor(second.id, first.id), [first.id, second.id].sort());
            assert.deepEqual(context.social.avoid({ accountId: first.id, targetAccountId: stranger.id }), {
              ok: false,
              reason: 'not-recent-partner'
            });
            assert.equal(context.social.shouldAvoid(first.id, second.id), false);

            assert.deepEqual(context.social.avoid({ accountId: first.id, targetAccountId: second.id, now: 200 }), {
              ok: true,
              avoided: true,
              created: true
            });
            assert.equal(context.social.shouldAvoid(first.id, second.id), true);
            assert.deepEqual(context.social.listAvoided(first.id), [
              { id: second.id, name: 'Второй', avoidedAt: 200 }
            ]);
            assert.deepEqual(context.social.listAvoided(second.id), []);

            assert.equal(context.social.avoid({ accountId: second.id, targetAccountId: first.id, now: 300 }).created, true);
            assert.equal(context.db.prepare('SELECT COUNT(*) AS count FROM matchmaking_avoids').get().count, 1);

            assert.deepEqual(context.social.unavoid({ accountId: first.id, targetAccountId: second.id }), {
              ok: true,
              avoided: false,
              removed: true
            });
            assert.deepEqual(context.social.listAvoided(first.id), []);
            assert.equal(context.social.shouldAvoid(first.id, second.id), true, 'second choice still protects pair');

            assert.equal(context.social.unavoid({ accountId: second.id, targetAccountId: first.id }).removed, true);
            assert.equal(context.social.shouldAvoid(first.id, second.id), false);
            assert.equal(context.db.prepare('SELECT COUNT(*) AS count FROM matchmaking_avoids').get().count, 0);
            context.db.close();
          });

          test('profile only exposes the current account own avoid choice', () => {
            const context = fresh();
            const { first, second } = partnered(context);
            context.social.avoid({ accountId: first.id, targetAccountId: second.id, now: 200 });
            assert.equal(context.accounts.profile(first.id).recentPartner.avoided, true);
            assert.equal(context.accounts.profile(second.id).recentPartner.avoided, false);
            context.db.close();
          });

          test('social actions are limited to the most recent partner', () => {
            const context = fresh();
            const { first, second } = partnered(context);
            const third = context.accounts.create('Третий');
            context.accounts.recordCoopPartners({
              accountIds: [first.id, third.id],
              chapterId: 'ch5',
              playedAt: 500
            });

            assert.equal(context.social.isRecentPartner(first.id, third.id), true);
            assert.equal(context.social.isRecentPartner(first.id, second.id), false);
            assert.deepEqual(context.social.avoid({ accountId: first.id, targetAccountId: second.id }), {
              ok: false,
              reason: 'not-recent-partner'
            });
            assert.deepEqual(
              context.social.report({ accountId: first.id, targetAccountId: second.id, reason: 'afk' }),
              { ok: false, reason: 'not-recent-partner' }
            );
            context.db.close();
          });

          test('report accepts fixed reasons and suppresses spam during cooldown', () => {
            const context = fresh();
            const { first, second } = partnered(context);

            assert.deepEqual(REPORT_REASONS, ['afk', 'griefing', 'offensive-name', 'exploit-cheat']);
            assert.deepEqual(
              context.social.report({
                accountId: first.id,
                targetAccountId: second.id,
                reason: 'free text',
                now: 1000
              }),
              { ok: false, reason: 'invalid-reason' }
            );

            assert.deepEqual(
              context.social.report({ accountId: first.id, targetAccountId: second.id, reason: 'afk', now: 1000 }),
              { ok: true, accepted: true, duplicate: false, reportCount: 1 }
            );
            assert.deepEqual(
              context.social.report({ accountId: first.id, targetAccountId: second.id, reason: 'afk', now: 1500 }),
              { ok: true, accepted: false, duplicate: true, reportCount: 1 }
            );
            assert.deepEqual(
              context.social.report({ accountId: first.id, targetAccountId: second.id, reason: 'afk', now: 2100 }),
              { ok: true, accepted: true, duplicate: false, reportCount: 2 }
            );
            const row = context.db
              .prepare('SELECT report_count, first_reported_at, last_reported_at FROM social_reports')
              .get();
            assert.deepEqual({ ...row }, { report_count: 2, first_reported_at: 1000, last_reported_at: 2100 });
            context.db.close();
          });

          test('social HTTP routes list and restore only the authenticated account own avoids', async () => {
            const context = fresh();
            const { first, second } = partnered(context);
            const app = express();
            installSocialRoutes({
              app,
              socialSafety: context.social,
              requireSession(req, res) {
                const accountId = req.headers['x-test-account'];
                if (accountId) return { accountId: String(accountId) };
                res.status(401).json({ ok: false, error: 'session-required' });
                return null;
              }
            });
            const server = await listen(app);
            try {
              const unauthenticated = await fetch(`${server.url}/api/social/avoid`, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ targetAccountId: second.id })
              });
              assert.equal(unauthenticated.status, 401);

              const freeText = await fetch(`${server.url}/api/social/report`, {
                method: 'POST',
                headers: { 'content-type': 'application/json', 'x-test-account': first.id },
                body: JSON.stringify({ targetAccountId: second.id, reason: 'afk', text: 'не должно пройти' })
              });
              assert.equal(freeText.status, 400);
              assert.equal((await freeText.json()).error, 'invalid-payload');

              const avoid = await fetch(`${server.url}/api/social/avoid`, {
                method: 'POST',
                headers: { 'content-type': 'application/json', 'x-test-account': first.id },
                body: JSON.stringify({ targetAccountId: second.id })
              });
              assert.equal(avoid.status, 200);
              assert.equal((await avoid.json()).avoided, true);

              const firstList = await fetch(`${server.url}/api/social/avoids`, {
                method: 'POST',
                headers: { 'content-type': 'application/json', 'x-test-account': first.id },
                body: '{}'
              });
              assert.deepEqual((await firstList.json()).players.map(player => player.id), [second.id]);

              const secondList = await fetch(`${server.url}/api/social/avoids`, {
                method: 'POST',
                headers: { 'content-type': 'application/json', 'x-test-account': second.id },
                body: '{}'
              });
              assert.deepEqual((await secondList.json()).players, []);

              const restored = await fetch(`${server.url}/api/social/unavoid`, {
                method: 'POST',
                headers: { 'content-type': 'application/json', 'x-test-account': first.id },
                body: JSON.stringify({ targetAccountId: second.id })
              });
              assert.equal((await restored.json()).removed, true);
              assert.equal(context.social.shouldAvoid(first.id, second.id), false);
            } finally {
              await server.close();
              context.db.close();
            }
          });

          test('social API payload has no free-text channel', () => {
            assert.equal(keysOnly({ targetAccountId: 'p2' }, new Set(['targetAccountId'])), true);
            assert.equal(
              keysOnly({ targetAccountId: 'p2', reason: 'afk' }, new Set(['targetAccountId', 'reason'])),
              true
            );
            assert.equal(
              keysOnly(
                { targetAccountId: 'p2', reason: 'afk', text: 'произвольный текст' },
                new Set(['targetAccountId', 'reason'])
              ),
              false
            );
          });
          """)

          for path in ['package.json', 'package-lock.json']:
              p = Path(path)
              text = p.read_text()
              if '2.5.0' not in text:
                  raise SystemExit(f'{path}: expected version 2.5.0')
              p.write_text(text.replace('2.5.0', '2.6.0'))
          replace('server/observability.test.mjs', "version: '2.5.0'", "version: '2.6.0'")
          PY
