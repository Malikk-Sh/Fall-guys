name: Apply network auth hardening

on:
  push:
    branches:
      - agent/network-auth-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/network-auth-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact server identity patch
        run: node tools/apply-network-auth-hardening.cjs
      - name: Commit patched server
        shell: bash
        run: |
          if git diff --quiet -- server/index.js; then
            echo "No server patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js
          git commit -m "Bind account identity to WebSocket"
          git push origin HEAD:agent/network-auth-hardening
