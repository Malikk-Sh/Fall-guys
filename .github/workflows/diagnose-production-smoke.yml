name: Diagnose production smoke

on:
  push:
    branches:
      - agent/production-safety

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-safety
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture exact production smoke output
        shell: bash
        run: |
          set +e
          tmp_dir="$(mktemp -d)"
          server_log="$tmp_dir/server.log"
          export LEADERBOARD_DB="$tmp_dir/game.db"
          export BACKUP_DIR="$tmp_dir/backups"
          export BACKUP_STATUS_FILE="$tmp_dir/backups/status.json"
          export PORT=3100
          export HOST=127.0.0.1
          export ALLOWED_ORIGINS=http://127.0.0.1:3100
          node server/bootstrap.js >"$server_log" 2>&1 &
          server_pid=$!

          ready=0
          for i in {1..50}; do
            curl -fsS --max-time 1 http://127.0.0.1:3100/health/live >"$tmp_dir/live.out" 2>"$tmp_dir/live.err"
            live_code=$?
            if [ "$live_code" -eq 0 ]; then
              ready=1
              echo "$i" >"$tmp_dir/ready-at"
              break
            fi
            sleep 0.1
          done

          node server/backupCli.mjs create >"$tmp_dir/backup.out" 2>"$tmp_dir/backup.err"
          backup_code=$?
          curl -sS --max-time 3 http://127.0.0.1:3100/health >"$tmp_dir/health.out" 2>"$tmp_dir/health.err"
          health_code=$?
          SMOKE_URL=http://127.0.0.1:3100 \
          SMOKE_ORIGIN=http://127.0.0.1:3100 \
          bash -x deploy/smoke.sh --require-backup >"$tmp_dir/smoke.out" 2>"$tmp_dir/smoke.err"
          smoke_code=$?

          kill "$server_pid" >/dev/null 2>&1
          wait "$server_pid" >/dev/null 2>&1

          {
            echo "ready=$ready"
            echo "ready_at=$(cat "$tmp_dir/ready-at" 2>/dev/null)"
            echo "backup_code=$backup_code"
            echo "health_code=$health_code"
            echo "smoke_code=$smoke_code"
            echo "--- backup stdout ---"
            cat "$tmp_dir/backup.out"
            echo "--- backup stderr ---"
            cat "$tmp_dir/backup.err"
            echo "--- health stdout ---"
            cat "$tmp_dir/health.out"
            echo "--- health stderr ---"
            cat "$tmp_dir/health.err"
            echo "--- smoke stdout ---"
            cat "$tmp_dir/smoke.out"
            echo "--- smoke stderr ---"
            cat "$tmp_dir/smoke.err"
            echo "--- server log ---"
            cat "$server_log"
          } > production-smoke-diagnostic.txt
          rm -rf "$tmp_dir"
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production-smoke-diagnostic.txt
          git commit -m "Capture production smoke diagnostic"
          git push origin HEAD:agent/production-safety
