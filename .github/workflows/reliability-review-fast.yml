name: Reliability review fast validation

on:
  push:
    branches: [fix/reliability-review-batch]

permissions:
  contents: write

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply canonical formatting
        run: >-
          npx prettier --write
          client/admin/reliability.js
          server/bootstrap.js
          server/reliability.test.mjs
          server/serviceReliability.js

      - name: Lint review changes
        run: >-
          npx eslint
          client/admin/reliability.js
          server/bootstrap.js
          server/reliability.test.mjs
          server/serviceReliability.js

      - name: Run targeted reliability and migration tests
        run: node --test server/reliability.test.mjs server/migrations.test.mjs

      - name: Commit formatter output if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formatting already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/admin/reliability.js \
            server/bootstrap.js \
            server/reliability.test.mjs \
            server/serviceReliability.js
          git commit -m "Format reliability review fixes"
          git push origin HEAD:fix/reliability-review-batch
